                    border: 1px solid #2D3748;
                    border-radius: 8px;
                    margin-bottom: 14px;
                    overflow: hidden;
                }
                .month-group-header {
                    background: #1E2430;
                    padding: 10px 12px;
                    font-size: 13px;
                    font-weight: bold;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    border-bottom: 1px solid #2D3748;
                }
                .archive-item {
                    padding: 10px 12px;
                    border-bottom: 1px solid #232936;
                }
                .archive-item:last-child { border-bottom: none; }
                .archive-item-top {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 6px;
                }
                .archive-leg-detail {
                    font-size: 11px;
                    color: var(--text-sub);
                    display: flex;
                    justify-content: space-between;
                    margin-top: 3px;
                }
                .btn-del {
                    background: #E53E3E;
                    border: none;
                    color: white;
                    padding: 3px 6px;
                    border-radius: 4px;
                    cursor: pointer;
                    font-size: 11px;
                }
            </style>
        </head>
        <body>
            <div class="header">
                <div class="brand">
                    <span class="brand-badge">AVA</span>
                    <span>AvaFix Logbook</span>
                </div>
                <button class="drawer-btn" onclick="toggleDrawer(true)">📂 سوابق ماهانه</button>
            </div>

            <div class="container">
                <div class="month-banner">
                    <div style="font-size:12px; color:var(--text-sub); margin-bottom:8px;">انتخاب دوره جهت محاسبه و بررسی:</div>
                    <div class="date-grid" style="margin-bottom: 12px;">
                        <select id="reviewYear" onchange="onReviewFilterChange()"></select>
                        <select id="reviewMonth" onchange="onReviewFilterChange()"></select>
                    </div>
                    <div class="month-banner-row">
                        <div>
                            <div class="month-title" id="reviewBannerTitle">مجموع ساعات:</div>
                            <div style="font-size:11px; color:#718096;" id="reviewGregorianPeriod">--</div>
                        </div>
                        <div class="month-hours" id="monthlyTotalDisplay">00:00 <span>ساعت</span></div>
                    </div>
                </div>

                <div class="card">
                    <div class="section-header">
                        <span>ثبت پرواز جدید</span>
                        <span id="legsCountBadge" style="font-size:11px; color:var(--text-sub);">۰ لگ انتخاب‌شده</span>
                    </div>

                    <div class="form-group">
                        <label>تاریخ پرواز (شمسی و میلادی):</label>
                        <div class="date-grid">
                            <select id="flightYear" onchange="updateFlightDatePreview()"></select>
                            <select id="flightMonth" onchange="updateFlightDatePreview()"></select>
                            <select id="flightDay" onchange="updateFlightDatePreview()"></select>
                        </div>
