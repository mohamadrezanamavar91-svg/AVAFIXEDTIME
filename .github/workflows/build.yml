name: Build AvaFix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project & App Structure
      run: |
        mkdir -p app/src/main/java/com/avafix/logbook
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        # 2. build.gradle (Root)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.avafix.logbook'
            compileSdk 34
            defaultConfig {
                applicationId "com.avafix.logbook"
                minSdk 24
                targetSdk 34
                versionCode 8
                versionName "2.5"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.debug
                }
            }
        }
        EOF

        # 4. styles.xml
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AvaFix" parent="android:Theme.Material.NoActionBar">
                <item name="android:statusBarColor">#0B0E14</item>
            </style>
        </resources>
        EOF

        # 5. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="AvaFix"
                android:theme="@style/Theme.AvaFix">
                <activity
                    android:name=".MainActivity"
                    android:windowSoftInputMode="adjustResize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. layout
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <android.webkit.WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview"
            android:layout_width="match_parent"
            android:layout_height="match_parent" />
        EOF

        # 7. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/avafix/logbook/MainActivity.java
        package com.avafix.logbook;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                WebView webView = findViewById(R.id.webview);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setDatabaseEnabled(true);

                webView.loadUrl("file:///android_asset/index.html");
            }
        }
        EOF

        # 8. Web App Assets (index.html)
        cat << 'EOF' > app/src/main/assets/index.html
        <!DOCTYPE html>
        <html lang="fa" dir="rtl">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
          <title>AvaFix Crew Logbook</title>
          <style>
            :root {
              --red: #D31A2B;
              --bg: #090B10;
              --card: #131722;
              --border: #242A38;
              --text: #F3F4F6;
              --sub: #94A3B8;
              --gold: #F59E0B;
              --ok: #10B981;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            body { background: var(--bg); color: var(--text); padding: 16px 14px 70px; min-height: 100vh; }
            
            .header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
            .badge-top { display: inline-flex; align-items: center; background: rgba(211,26,43,0.15); border: 1px solid rgba(211,26,43,0.35); padding: 3px 10px; border-radius: 99px; color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
            h1 { font-size: 21px; font-weight: 900; margin-top: 4px; text-align: center; }
            
            /* Card Containers */
            .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; position: relative; }
            .card.accent { border-right: 4px solid var(--red); }
            
            label { display: block; font-size: 11px; color: var(--sub); margin: 8px 0 4px; font-weight: 700; }
            select, input {
              width: 100%; background: #0C0F17; border: 1px solid #283042; border-radius: 10px; color: #FFF; padding: 11px 12px; font-size: 14px; font-weight: 700; outline: none; transition: border-color 0.2s;
            }
            select:focus, input:focus { border-color: var(--red); }
            
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            
            /* Calendar Switcher */
            .cal-selector-bar { display: flex; background: #0A0C12; border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
            .cal-btn { flex: 1; border: none; background: none; color: var(--sub); padding: 7px; font-size: 12px; font-weight: 800; border-radius: 8px; cursor: pointer; }
            .cal-btn.active { background: var(--red); color: #fff; }

            .btn-primary { width: 100%; margin-top: 14px; background: #1F2737; border: 1px solid #333F56; color: #FFF; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; }
            .btn-primary:active { opacity: 0.8; }
            .btn-sum { width: 100%; margin-top: 14px; background: var(--red); border: none; color: #fff; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; }
            
            .route-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
            .route-info b { font-size: 14px; color: #fff; display: block; }
            .route-info span { font-size: 11px; color: var(--sub); }
            .route-action { display: flex; align-items: center; gap: 8px; }
            .route-badge { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); color: var(--gold); padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: 800; direction: ltr; }
            .btn-del { background: rgba(211,26,43,0.15); border: 1px solid rgba(211,26,43,0.3); color: var(--red); font-size: 13px; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
            
            .total-card { background: linear-gradient(135deg, #131722 0%, #1e1317 100%); border: 1px solid rgba(211,26,43,0.4); border-radius: 16px; padding: 18px; text-align: center; margin-top: 14px; }
            .tot-title { font-size: 12px; color: var(--sub); font-weight: 700; }
            .tot-val { font-size: 34px; font-weight: 900; color: var(--ok); margin: 6px 0; font-variant-numeric: tabular-nums; direction: ltr; }
            .tot-sub { font-size: 12px; color: var(--sub); }
          </style>
        </head>
        <body>

          <!-- Top Brand Header -->
          <div style="text-align: center; margin-bottom: 14px;">
            <div class="badge-top">✈ AVA AIRLINES CREW</div>
            <h1>AvaFix Logbook</h1>
          </div>

          <!-- Month & Year Selector Card (1405 to 1415 / 2026 to 2036) -->
          <div class="card">
            <div class="cal-selector-bar">
              <button class="cal-btn active" id="btnShamsi" onclick="setCalType('shamsi')">تقویم شمسی</button>
              <button class="cal-btn" id="btnMiladi" onclick="setCalType('miladi')">تقویم میلادی (UTC)</button>
            </div>
            
            <div class="grid-2">
              <div>
                <label>سال کاری</label>
                <select id="yearSelect" onchange="onPeriodChanged()"></select>
              </div>
              <div>
                <label>ماه کاری</label>
                <select id="monthSelect" onchange="onPeriodChanged()"></select>
              </div>
            </div>
          </div>

          <!-- Route Selection Card -->
          <div class="card accent">
            <label>انتخاب روت مصوب آوا</label>
            <select id="routeSelect" onchange="onRouteSelected()"></select>

            <div class="grid-2">
              <div>
                <label>کد روت</label>
                <input type="text" id="routeCodeInput" placeholder="مثال: THR-MHD">
              </div>
              <div>
                <label>فیکس تایم (HH:MM)</label>
                <input type="text" id="fixTimeInput" placeholder="01:45" style="direction:ltr; text-align:center; font-weight:900; color:var(--gold);">
              </div>
            </div>

            <button class="btn-primary" onclick="addFlightRoute()">+ افزودن این روت به لاگ‌بوک</button>
          </div>

          <!-- Current Month's Route List -->
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <span style="font-weight:800; font-size:13px;" id="listTitleHeader">روت‌های ثبت شده</span>
              <span style="font-size:11px; color:var(--red); cursor:pointer; font-weight:700;" onclick="clearCurrentLog()">پاکسازی این ماه</span>
            </div>
            
            <div id="routesListContainer"></div>
            
            <button class="btn-sum" onclick="calculateTotalHours()">🧮 محاسبه و بستن جمع ساعات</button>
          </div>

          <!-- Summary Box -->
          <div class="total-card" id="summaryBox" style="display:none;">
            <div class="tot-title">مجموع ساعات فیکس پرواز (Total Block Time)</div>
            <div class="tot-val" id="totalDisplay">00:00</div>
            <div class="tot-sub" id="totalCountDisplay">۰ لگ پروازی • ۰ دقیقه</div>
          </div>

          <script>
            // Database of Ava Airlines Approved Fix Times
            const AVA_ROUTES = [
              { code: "THR-MHD", name: "تهران ⇄ مشهد", dur: "01:45", min: 105 },
              { code: "MHD-THR", name: "مشهد ⇄ تهران", dur: "01:55", min: 115 },
              { code: "THR-GSM", name: "تهران ⇄ قشم", dur: "02:25", min: 145 },
              { code: "GSM-THR", name: "قشم ⇄ تهران", dur: "02:35", min: 155 },
              { code: "MHD-KSH", name: "مشهد ⇄ کرمانشاه", dur: "02:45", min: 165 },
              { code: "KSH-MHD", name: "کرمانشاه ⇄ مشهد", dur: "02:25", min: 145 },
              { code: "MHD-SYZ", name: "مشهد ⇄ شیراز", dur: "02:35", min: 155 },
              { code: "SYZ-MHD", name: "شیراز ⇄ مشهد", dur: "02:20", min: 140 },
              { code: "MHD-AWZ", name: "مشهد ⇄ اهواز", dur: "03:05", min: 185 },
              { code: "AWZ-MHD", name: "اهواز ⇄ مشهد", dur: "02:40", min: 160 },
              { code: "THR-KIH", name: "تهران ⇄ کیش", dur: "02:25", min: 145 },
              { code: "KIH-THR", name: "کیش ⇄ تهران", dur: "02:25", min: 145 },
              { code: "MHD-IFN", name: "مشهد ⇄ اصفهان", dur: "02:20", min: 140 },
              { code: "IFN-MHD", name: "اصفهان ⇄ مشهد", dur: "02:05", min: 125 },
              { code: "MHD-TBZ", name: "مشهد ⇄ تبریز", dur: "03:00", min: 180 },
              { code: "TBZ-MHD", name: "تبریز ⇄ مشهد", dur: "02:40", min: 160 },
              { code: "THR-OMH", name: "تهران ⇄ ارومیه", dur: "01:40", min: 100 },
              { code: "OMH-MHD", name: "ارومیه ⇄ مشهد", dur: "02:35", min: 155 },
              { code: "MHD-OMH", name: "مشهد ⇄ ارومیه", dur: "03:05", min: 185 },
              { code: "OMH-THR", name: "ارومیه ⇄ تهران", dur: "01:35", min: 95 },
              { code: "THR-ADU", name: "تهران ⇄ اردبیل", dur: "01:20", min: 80 },
              { code: "ADU-MHD", name: "اردبیل ⇄ مشهد", dur: "02:25", min: 145 },
              { code: "MHD-ADU", name: "مشهد ⇄ اردبیل", dur: "02:40", min: 160 },
              { code: "ADU-THR", name: "اردبیل ⇄ تهران", dur: "01:15", min: 75 },
              { code: "THR-BND", name: "تهران ⇄ بندرعباس", dur: "02:20", min: 140 },
              { code: "BND-THR", name: "بندرعباس ⇄ تهران", dur: "02:35", min: 155 },
              { code: "MHD-KIH", name: "مشهد ⇄ کیش", dur: "03:05", min: 185 },
              { code: "KIH-MHD", name: "کیش ⇄ مشهد", dur: "03:00", min: 180 },
              { code: "THR-AWZ", name: "تهران ⇄ اهواز", dur: "01:30", min: 90 },
              { code: "AWZ-THR", name: "اهواز ⇄ تهران", dur: "01:30", min: 90 },
              { code: "THR-ABD", name: "تهران ⇄ آبادان", dur: "01:40", min: 100 },
              { code: "ABD-MHD", name: "آبادان ⇄ مشهد", dur: "02:35", min: 155 },
              { code: "MHD-ABD", name: "مشهد ⇄ آبادان", dur: "02:55", min: 175 },
              { code: "ABD-THR", name: "آبادان ⇄ تهران", dur: "01:35", min: 95 },
              { code: "THR-SYZ", name: "تهران ⇄ شیراز", dur: "01:40", min: 100 },
              { code: "SYZ-THR", name: "شیراز ⇄ تهران", dur: "01:40", min: 100 },
              { code: "MHD-NJF", name: "مشهد ⇄ نجف", dur: "03:20", min: 200 },
              { code: "NJF-MHD", name: "نجف ⇄ مشهد", dur: "03:10", min: 190 },
              { code: "IKA-IST", name: "امام خمینی ⇄ استانبول", dur: "04:50", min: 290 },
              { code: "IST-IKA", name: "استانبول ⇄ امام خمینی", dur: "04:10", min: 250 },
              { code: "HAM-NJF", name: "همدان ⇄ نجف", dur: "01:50", min: 110 },
              { code: "NJF-HAM", name: "نجف ⇄ همدان", dur: "01:40", min: 100 },
              { code: "IKA-NJF", name: "امام خمینی ⇄ نجف", dur: "02:20", min: 140 },
              { code: "NJF-IKA", name: "نجف ⇄ امام خمینی", dur: "02:00", min: 120 },
              { code: "THR-TBZ", name: "تهران ⇄ تبریز", dur: "01:25", min: 85 },
              { code: "TBZ-THR", name: "تبریز ⇄ تهران", dur: "01:20", min: 80 },
              { code: "THR-ZAH", name: "تهران ⇄ زاهدان", dur: "02:30", min: 150 },
              { code: "ZAH-THR", name: "زاهدان ⇄ تهران", dur: "02:30", min: 150 },
              { code: "THR-ZBR", name: "تهران ⇄ چابهار", dur: "02:45", min: 165 },
              { code: "ZBR-THR", name: "چابهار ⇄ تهران", dur: "02:55", min: 175 },
              { code: "THR-BUZ", name: "تهران ⇄ بوشهر", dur: "01:40", min: 100 },
              { code: "BUZ-THR", name: "بوشهر ⇄ تهران", dur: "01:45", min: 105 },
              { code: "KSH-KIH", name: "کرمانشاه ⇄ کیش", dur: "02:10", min: 130 },
              { code: "KIH-KSH", name: "کیش ⇄ کرمانشاه", dur: "02:20", min: 140 },
              { code: "KIS-TBZ", name: "کیش ⇄ تبریز", dur: "03:00", min: 180 },
              { code: "TBZ-KIS", name: "تبریز ⇄ کیش", dur: "02:45", min: 165 },
              { code: "KIH-IFN", name: "کیش ⇄ اصفهان", dur: "01:30", min: 90 },
              { code: "IFN-KIH", name: "اصفهان ⇄ کیش", dur: "01:35", min: 95 },
              { code: "MHD-RAS-MHD", name: "مشهد ⇄ رامسر ⇄ مشهد", dur: "04:10", min: 250 },
              { code: "MHD-BGW-MHD", name: "مشهد ⇄ بغداد ⇄ مشهد", dur: "06:15", min: 375 }
            ];

            const SHAMSI_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
            const MILADI_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

            let currentCal = localStorage.getItem("ava_cal") || "shamsi";
            let currentYear = localStorage.getItem("ava_year") || "1405";
            let currentMonth = localStorage.getItem("ava_month") || "0";

            function setCalType(type) {
              currentCal = type;
              localStorage.setItem("ava_cal", type);
              document.getElementById("btnShamsi").classList.toggle("active", type === "shamsi");
              document.getElementById("btnMiladi").classList.toggle("active", type === "miladi");
              
              initDateSelectors();
              renderMonthRoutes();
            }

            function initDateSelectors() {
              const ySel = document.getElementById("yearSelect");
              const mSel = document.getElementById("monthSelect");
              ySel.innerHTML = "";
              mSel.innerHTML = "";

              if (currentCal === "shamsi") {
                // 10 Years: 1405 to 1415
                for (let y = 1405; y <= 1415; y++) {
                  const opt = document.createElement("option");
                  opt.value = y;
                  opt.textContent = `سال ${y}`;
                  ySel.appendChild(opt);
                }
                SHAMSI_MONTHS.forEach((m, idx) => {
                  const opt = document.createElement("option");
                  opt.value = idx;
                  opt.textContent = m;
                  mSel.appendChild(opt);
                });
                if (!currentYear.startsWith("14")) currentYear = "1405";
              } else {
                // 10 Years: 2026 to 2036
                for (let y = 2026; y <= 2036; y++) {
                  const opt = document.createElement("option");
                  opt.value = y;
                  opt.textContent = `Year ${y}`;
                  ySel.appendChild(opt);
                }
                MILADI_MONTHS.forEach((m, idx) => {
                  const opt = document.createElement("option");
                  opt.value = idx;
                  opt.textContent = m;
                  mSel.appendChild(opt);
                });
                if (!currentYear.startsWith("20")) currentYear = "2026";
              }

              ySel.value = currentYear;
              mSel.value = currentMonth;
              updateHeaderTitle();
            }

            function onPeriodChanged() {
              currentYear = document.getElementById("yearSelect").value;
              currentMonth = document.getElementById("monthSelect").value;
              localStorage.setItem("ava_year", currentYear);
              localStorage.setItem("ava_month", currentMonth);
              updateHeaderTitle();
              renderMonthRoutes();
              document.getElementById("summaryBox").style.display = "none";
            }

            function getStorageKey() {
              return `ava_log_${currentCal}_${currentYear}_${currentMonth}`;
            }

            function updateHeaderTitle() {
              const mName = currentCal === "shamsi" ? SHAMSI_MONTHS[currentMonth] : MILADI_MONTHS[currentMonth];
              document.getElementById("listTitleHeader").innerText = `پروازهای ${mName} ${currentYear}`;
            }

            function initRoutes() {
              const sel = document.getElementById("routeSelect");
              sel.innerHTML = '<option value="-1">-- برای انتخاب روت لمس کنید --</option>';
              AVA_ROUTES.forEach((r, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `${r.code} • ${r.name} (${r.dur})`;
                sel.appendChild(opt);
              });
            }

            function onRouteSelected() {
              const sel = document.getElementById("routeSelect");
              if (sel.value < 0) return;
              const r = AVA_ROUTES[sel.value];
              document.getElementById("routeCodeInput").value = r.code;
              document.getElementById("fixTimeInput").value = r.dur;
            }

            function getFlights() {
              return JSON.parse(localStorage.getItem(getStorageKey()) || "[]");
            }

            function saveFlights(flights) {
              localStorage.setItem(getStorageKey(), JSON.stringify(flights));
            }

            function addFlightRoute() {
              const code = document.getElementById("routeCodeInput").value.trim();
              const dur = document.getElementById("fixTimeInput").value.trim();
              if (!code || !dur) {
                alert("لطفاً روت و فیکس تایم را وارد یا انتخاب کنید.");
                return;
              }
              const p = dur.split(":");
              if (p.length !== 2) {
                alert("فرمت زمان باید به شکل 01:45 باشد.");
                return;
              }
              const min = parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
              if (isNaN(min)) {
                alert("زمان نامعتبر است.");
                return;
              }

              const list = getFlights();
              list.push({ id: Date.now(), code: code, dur: dur, min: min });
              saveFlights(list);
              renderMonthRoutes();
              document.getElementById("summaryBox").style.display = "none";
            }

            function deleteFlight(id) {
              let list = getFlights();
              list = list.filter(item => item.id !== id);
              saveFlights(list);
              renderMonthRoutes();
              document.getElementById("summaryBox").style.display = "none";
            }

            function clearCurrentLog() {
              if (confirm("آیا مایل به حذف کلیه روت‌های این ماه هستید؟")) {
                localStorage.removeItem(getStorageKey());
                renderMonthRoutes();
                document.getElementById("summaryBox").style.display = "none";
              }
            }

            function renderMonthRoutes() {
              const list = getFlights();
              const container = document.getElementById("routesListContainer");
              container.innerHTML = "";
              if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:14px 0; color:var(--sub); font-size:12px;">هنوز روتی برای این ماه ثبت نشده است.</div>';
                return;
              }
              list.forEach((item, index) => {
                const el = document.createElement("div");
                el.className = "route-item";
                el.innerHTML = `
                  <div class="route-info">
                    <b>${index + 1}. ${item.code}</b>
                    <span>فیکس مصوب: ${item.dur} (${item.min} دقیقه)</span>
                  </div>
                  <div class="route-action">
                    <div class="route-badge">${item.dur}</div>
                    <button class="btn-del" onclick="deleteFlight(${item.id})">✕</button>
                  </div>
                `;
                container.appendChild(el);
              });
            }

            function calculateTotalHours() {
              const list = getFlights();
              if (list.length === 0) {
                alert("هیچ روتی برای محاسبه در این ماه وجود ندارد.");
                return;
              }
              let sumMin = 0;
              list.forEach(i => sumMin += i.min);
              const hours = Math.floor(sumMin / 60);
              const minutes = sumMin % 60;
              const formatted = String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0");

              document.getElementById("totalDisplay").innerText = formatted;
              document.getElementById("totalCountDisplay").innerText = `${list.length} لگ پروازی • ${sumMin} دقیقه مجموع پرواز`;
              document.getElementById("summaryBox").style.display = "block";
              window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
            }

            window.onload = function() {
              initRoutes();
              setCalType(currentCal);
            };
          </script>
        </body>
        </html>
        EOF

    - name: Build Release APK with Gradle
      run: |
        chmod +x gradlew || gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AvaFix-v2.5
        path: app/build/outputs/apk/release/*.apk
