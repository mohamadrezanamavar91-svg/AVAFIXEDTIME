name: Build AvaFix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: pip install Pillow

    - name: Build Project Structure
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/java/com/avafix/logbook
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # Generate Python Icon Script
        cat << 'EOF' > make_icon.py
        import math
        from PIL import Image, ImageDraw
        def generate_ava_icon(size):
            img = Image.new("RGBA", (size, size), (9, 11, 16, 255))
            draw = ImageDraw.Draw(img)
            r = size * 0.44
            cx, cy = size * 0.5, size * 0.5
            draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill=(211, 26, 43, 255))
            steps = 360
            heart_scale = size * 0.016
            heart_cx = cx
            heart_cy = cy - size * 0.02
            for i in range(steps):
                t = (2 * math.pi * i) / steps
                x = 16 * (math.sin(t) ** 3)
                y = -(13 * math.cos(t) - 5 * math.cos(2*t) - 2 * math.cos(3*t) - math.cos(4*t))
                px = heart_cx + x * heart_scale
                py = heart_cy + y * heart_scale
                rad = (size * 0.012) + (math.sin(t*3) * (size * 0.005))
                draw.ellipse([px - rad, py - rad, px + rad, py + rad], fill=(255, 255, 255, 245))
            return img
        sizes = {"app/src/main/res/mipmap-hdpi/ic_launcher.png": 72, "app/src/main/res/mipmap-xhdpi/ic_launcher.png": 96, "app/src/main/res/mipmap-xxhdpi/ic_launcher.png": 144, "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": 192}
        for path, s in sizes.items():
            icon = generate_ava_icon(s)
            icon.save(path, "PNG")
        EOF
        python make_icon.py

        # Create Config Files
        cat << 'EOF' > settings.gradle
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.avafix.logbook'
            compileSdk 34
            defaultConfig { applicationId "com.avafix.logbook"; minSdk 24; targetSdk 34; versionCode 11; versionName "2.7" }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="AvaFix" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/avafix/logbook/MainActivity.java
        package com.avafix.logbook;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle b) {
                super.onCreate(b);
                WebView wv = new WebView(this);
                wv.getSettings().setJavaScriptEnabled(true);
                wv.getSettings().setDomStorageEnabled(true);
                wv.loadUrl("file:///android_asset/index.html");
                setContentView(wv);
            }
        }
        EOF

        # Note: HTML content is large, keep it in index.html block
        cat << 'EOF' > app/src/main/assets/index.html
        <!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>body{background:#090B10; color:#fff; font-family:sans-serif; padding:20px;}</style></head>
        <body><h1>AvaFix v2.7 Ready</h1></body></html>
        EOF

    - name: Build
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon
