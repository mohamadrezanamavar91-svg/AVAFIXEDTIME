name: Build AvaFix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Pillow
      run: pip install Pillow

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/java/com/avafix/logbook
        mkdir -p app/src/main/res/values

        cat > make_icon.py << 'PYEOF'
        import math
        from PIL import Image, ImageDraw

        def generate_ava_icon(size):
            img = Image.new("RGBA", (size, size), (11, 14, 21, 255))
            draw = ImageDraw.Draw(img)
            r = size * 0.44
            cx, cy = size * 0.5, size * 0.5
            draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill=(211, 26, 43, 255))
            heart_scale = size * 0.016
            heart_cx = cx
            heart_cy = cy - size * 0.02
            points = []
            for i in range(360):
                t = (2 * math.pi * i) / 360
                x = 16 * (math.sin(t) ** 3)
                y = -(13 * math.cos(t) - 5 * math.cos(2*t) - 2 * math.cos(3*t) - math.cos(4*t))
                points.append((heart_cx + x * heart_scale, heart_cy + y * heart_scale))
            draw.polygon(points, fill=(255, 255, 255, 255))
            return img

        sizes = {
            'app/src/main/res/mipmap-hdpi/ic_launcher.png': 72,
            'app/src/main/res/mipmap-xhdpi/ic_launcher.png': 96,
            'app/src/main/res/mipmap-xxhdpi/ic_launcher.png': 144,
            'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png': 192
        }
        for path, s in sizes.items():
            generate_ava_icon(s).save(path)
        PYEOF
        python make_icon.py

        cat > settings.gradle << 'GE'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AvaFix"
        include ':app'
        GE

        cat > build.gradle << 'GE'
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        GE

        cat > app/build.gradle << 'GE'
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.avafix.logbook'
            compileSdk 34

            defaultConfig {
                applicationId "com.avafix.logbook"
                minSdk 24
                targetSdk 34
                versionCode 19
                versionName "3.3"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                }
            }
        }
        GE

        cat > app/src/main/res/values/strings.xml << 'XE'
        <resources>
            <string name="app_name">AvaFix</string>
        </resources>
        XE

        cat > app/src/main/AndroidManifest.xml << 'XE'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        XE

        cat > app/src/main/java/com/avafix/logbook/MainActivity.java << 'JE'
        package com.avafix.logbook;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        JE

        cat > app/src/main/assets/index.html << 'HE'
        <!DOCTYPE html>
        <html lang="fa" dir="rtl">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>AvaFix</title>
            <style>
                body { margin:0; padding:24px; background:#0B0E15; color:#F8FAFC;
                       font-family: sans-serif; direction: rtl; text-align:center; }
                h1 { color:#00F5A0; font-size:22px; }
                p  { color:#94A3B8; font-size:14px; }
            </style>
        </head>
        <body>
            <h1>AvaFix Logbook v3.3</h1>
            <p>سیستم ثبت ساعت پروازی خدمه پروازی آوا</p>
        </body>
        </html>
        HE

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon --stacktrace

    - name: Show Build Outputs
      run: ls -R app/build/outputs || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AvaFix-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.3-build-${{ github.run_number }}
        name: AvaFix Logbook v3.3
        body: |
          نسخه‌ی نصبی مستقیم AvaFix Logbook
          فایل APK آماده نصب روی اندروید
        files: app/build/outputs/apk/release/*.apk
