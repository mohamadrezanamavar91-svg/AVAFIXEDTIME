                    background: #111E2E;
                    padding: 5px 8px;
                    border-radius: 6px;
                    border: 1px solid #1E3A5F;
                    direction: ltr;
                    text-align: right;
                }

                .btn-add-leg {
                    width: 100%;
                    background: #2D3748;
                    color: white;
                    border: 1px dashed #4A5568;
