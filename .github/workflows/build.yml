                }

                .drawer-overlay {
                    position: fixed;
                    top: 0; left: 0; right: 0; bottom: 0;
                    background: rgba(0,0,0,0.7);
                    display: none;
                    z-index: 200;
                }
                .drawer-content {
                    position: fixed;
                    top: 0; bottom: 0; right: -350px;
                    width: 330px;
                    background: var(--card-bg);
                    border-left: 1px solid var(--border-clr);
                    z-index: 201;
                    transition: right 0.3s ease;
