name: Build AvaFix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: pip install Pillow

    - name: Build Android Project & Assets
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/java/com/avafix/logbook
        mkdir -p app/src/main/res/values

        # 1. Generate App Icons via Python
        cat << 'EOF' > make_icon.py
        import math
        from PIL import Image, ImageDraw

        def generate_ava_icon(size):
            img = Image.new("RGBA", (size, size), (9, 11, 16, 255))
            draw = ImageDraw.Draw(img)
            r = size * 0.44
            cx, cy = size * 0.5, size * 0.5
            draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill=(211, 26, 43, 255))
            steps = 360
            heart_scale = size * 0.016
            heart_cx = cx
            heart_cy = cy - size * 0.02
            for i in range(steps):
                t = (2 * math.pi * i) / steps
                x = 16 * (math.sin(t) ** 3)
                y = -(13 * math.cos(t) - 5 * math.cos(2*t) - 2 * math.cos(3*t) - math.cos(4*t))
                px = heart_cx + x * heart_scale
                py = heart_cy + y * heart_scale
                rad = (size * 0.012) + (math.sin(t*3) * (size * 0.005))
                draw.ellipse([px - rad, py - rad, px + rad, py + rad], fill=(255, 255, 255, 245))
            return img

        sizes = {
            "app/src/main/res/mipmap-hdpi/ic_launcher.png": 72,
            "app/src/main/res/mipmap-xhdpi/ic_launcher.png": 96,
            "app/src/main/res/mipmap-xxhdpi/ic_launcher.png": 144,
            "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": 192
        }
        for path, s in sizes.items():
            icon = generate_ava_icon(s)
            icon.save(path, "PNG")
        EOF
        python make_icon.py

        # 2. Settings Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        # 3. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 4. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.avafix.logbook'
            compileSdk 34

            defaultConfig {
                applicationId "com.avafix.logbook"
                minSdk 24
                targetSdk 34
                versionCode 13
                versionName "2.9"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                }
            }
        }
        EOF

        # 5. Strings & Manifest
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">AvaFix</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. Java Activity
        cat << 'EOF' > app/src/main/java/com/avafix/logbook/MainActivity.java
        package com.avafix.logbook;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        # 7. AvaFix HTML/JS UI (با قابلیت افزودن لگ، تجمیع ساعتی و گزارش ماهیانه)
        cat << 'EOF' > app/src/main/assets/index.html
        <!DOCTYPE html>
        <html lang="fa" dir="rtl">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>AvaFix Logbook</title>
            <style>
                :root {
                    --bg-dark: #090B10;
                    --card-bg: #12151D;
                    --primary-red: #D31A2B;
                    --accent-cyan: #00E5FF;
                    --accent-green: #38A169;
                    --text-main: #FFFFFF;
                    --text-sub: #A0AEC0;
                    --border-clr: #232936;
                }
                * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
                body {
                    margin: 0;
                    padding: 0;
                    background: var(--bg-dark);
                    color: var(--text-main);
                    font-family: system-ui, -apple-system, sans-serif;
                    direction: rtl;
                }
                .header {
                    background: var(--card-bg);
                    padding: 14px 18px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    border-bottom: 1px solid var(--border-clr);
                    position: sticky;
                    top: 0;
                    z-index: 100;
                }
                .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
                .brand-badge { background: var(--primary-red); color: white; padding: 2px 7px; border-radius: 6px; font-size: 11px; }
                .drawer-btn {
                    background: #1A202C;
                    border: 1px solid var(--border-clr);
                    color: white;
                    padding: 8px 12px;
                    border-radius: 8px;
                    cursor: pointer;
                    font-size: 12px;
                }
                .container { padding: 14px; max-width: 520px; margin: 0 auto; }
                
                /* Monthly Summary Banner */
                .month-banner {
                    background: linear-gradient(135deg, #1C1917 0%, #12151D 100%);
                    border: 1px solid #38292B;
                    border-radius: 12px;
                    padding: 14px 16px;
                    margin-bottom: 14px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                .month-title { font-size: 13px; color: var(--text-sub); }
                .month-hours { font-size: 22px; font-weight: 900; color: #E2E8F0; }
                .month-hours span { font-size: 13px; color: var(--primary-red); font-weight: normal; margin-right: 4px; }

                .card {
                    background: var(--card-bg);
                    border: 1px solid var(--border-clr);
                    border-radius: 12px;
                    padding: 16px;
                    margin-bottom: 14px;
                }
                .section-header {
                    font-size: 14px;
                    font-weight: bold;
                    margin-bottom: 12px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    color: #E2E8F0;
                }
                .form-group { margin-bottom: 12px; }
                label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
                select {
                    width: 100%;
                    background: #1A202C;
                    border: 1px solid var(--border-clr);
                    color: white;
                    padding: 12px 10px;
                    border-radius: 8px;
                    font-size: 13px;
                    outline: none;
                }
                
                /* Leg action buttons */
                .btn-add-leg {
                    width: 100%;
                    background: #2D3748;
                    color: white;
                    border: 1px dashed #4A5568;
                    padding: 11px;
                    border-radius: 8px;
                    font-size: 13px;
                    font-weight: bold;
                    cursor: pointer;
                    margin-top: 4px;
                }
                .btn-add-leg:active { background: #374151; }

                /* Pending Legs List */
                .legs-list { margin: 12px 0; }
                .leg-row {
                    background: #161A23;
                    border: 1px solid var(--border-clr);
                    border-radius: 8px;
                    padding: 10px 12px;
                    margin-bottom: 8px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    font-size: 13px;
                }
                .leg-badge {
                    background: rgba(211, 26, 43, 0.2);
                    color: #FF6B6B;
                    padding: 3px 8px;
                    border-radius: 4px;
                    font-size: 12px;
                    font-weight: bold;
                }
                .btn-remove-leg {
                    background: none;
                    border: none;
                    color: #E53E3E;
                    cursor: pointer;
                    font-size: 16px;
                    padding: 0 4px;
                }

                .total-box {
                    background: #181D28;
                    border-radius: 8px;
                    padding: 12px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin: 12px 0;
                    border: 1px solid #2D3748;
                }
                .total-time-val { font-size: 18px; font-weight: 900; color: #68D391; }

                button.btn-primary {
                    width: 100%;
                    background: var(--primary-red);
                    color: white;
                    border: none;
                    padding: 13px;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: bold;
                    cursor: pointer;
                }
                button.btn-primary:disabled {
                    background: #4A5568;
                    cursor: not-allowed;
                }

                /* Drawer Sidebar */
                .drawer-overlay {
                    position: fixed;
                    top: 0; left: 0; right: 0; bottom: 0;
                    background: rgba(0,0,0,0.7);
                    display: none;
                    z-index: 200;
                }
                .drawer-content {
                    position: fixed;
                    top: 0; bottom: 0; right: -340px;
                    width: 320px;
                    background: var(--card-bg);
                    border-left: 1px solid var(--border-clr);
                    z-index: 201;
                    transition: right 0.3s ease;
                    display: flex;
                    flex-direction: column;
                }
                .drawer-open .drawer-overlay { display: block; }
                .drawer-open .drawer-content { right: 0; }
                .drawer-header {
                    padding: 16px;
                    border-bottom: 1px solid var(--border-clr);
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                .drawer-body {
                    padding: 14px;
                    overflow-y: auto;
                    flex: 1;
                }
                .archive-card {
                    background: #1A202C;
                    border: 1px solid var(--border-clr);
                    border-radius: 8px;
                    padding: 12px;
                    margin-bottom: 12px;
                }
                .archive-card-top {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    border-bottom: 1px solid #2D3748;
                    padding-bottom: 8px;
                    margin-bottom: 8px;
                }
                .archive-leg-item {
                    font-size: 12px;
                    color: var(--text-sub);
                    display: flex;
                    justify-content: space-between;
                    margin-bottom: 4px;
                }
                .btn-del {
                    background: #E53E3E;
                    border: none;
                    color: white;
                    padding: 4px 8px;
                    border-radius: 4px;
                    cursor: pointer;
                    font-size: 11px;
                }
            </style>
        </head>
        <body>
            <div class="header">
                <div class="brand">
                    <span class="brand-badge">AVA</span>
                    <span>AvaFix Logbook</span>
                </div>
                <button class="drawer-btn" onclick="toggleDrawer(true)">📂 سوابق و بایگانی</button>
            </div>

            <div class="container">
                <!-- تجمیع ماه جاری -->
                <div class="month-banner">
                    <div>
                        <div class="month-title">مجموع ساعات ثبت‌شده این ماه</div>
                        <div style="font-size:11px; color:#718096; margin-top:2px;">بر اساس FIXED TIME عملیات</div>
                    </div>
                    <div class="month-hours" id="monthlyTotalDisplay">00:00 <span>ساعت</span></div>
                </div>

                <!-- فرم ثبت پرواز چند لگی -->
                <div class="card">
                    <div class="section-header">
                        <span>افزودن لگ‌های پروازی</span>
                        <span id="legsCountBadge" style="font-size:11px; color:var(--text-sub);">۰ لگ انتخاب‌شده</span>
                    </div>

                    <div class="form-group">
                        <label>انتخاب مسیر پروازی (جهت‌دار با زمان مصوب):</label>
                        <select id="routeSelect">
                            <option value="THR-MHD|105|01:45">THR ➔ MHD (تهران - مشهد) | ۰۱:۴۵</option>
                            <option value="MHD-THR|115|01:55">MHD ➔ THR (مشهد - تهران) | ۰۱:۵۵</option>
                            <option value="THR-GSM|145|02:25">THR ➔ GSM (تهران - قشم) | ۰۲:۲۵</option>
                            <option value="GSM-THR|155|02:35">GSM ➔ THR (قشم - تهران) | ۰۲:۳۵</option>
                            <option value="MHD-KSH|165|02:45">MHD ➔ KSH (مشهد - کرمانشاه) | ۰۲:۴۵</option>
                            <option value="KSH-MHD|145|02:25">KSH ➔ MHD (کرمانشاه - مشهد) | ۰۲:۲۵</option>
                            <option value="MHD-SYZ|155|02:35">MHD ➔ SYZ (مشهد - شیراز) | ۰۲:۳۵</option>
                            <option value="SYZ-MHD|140|02:20">SYZ ➔ MHD (شیراز - مشهد) | ۰۲:۲۰</option>
                            <option value="MHD-AWZ|185|03:05">MHD ➔ AWZ (مشهد - اهواز) | ۰۳:۰۵</option>
                            <option value="AWZ-MHD|160|02:40">AWZ ➔ MHD (اهواز - مشهد) | ۰۲:۴۰</option>
                            <option value="THR-KIH|145|02:25">THR ➔ KIH (تهران - کیش) | ۰۲:۲۵</option>
                            <option value="KIH-THR|145|02:25">KIH ➔ THR (کیش - تهران) | ۰۲:۲۵</option>
                            <option value="MHD-IFN|140|02:20">MHD ➔ IFN (مشهد - اصفهان) | ۰۲:۲۰</option>
                            <option value="IFN-MHD|125|02:05">IFN ➔ MHD (اصفهان - مشهد) | ۰۲:۰۵</option>
                            <option value="MHD-TBZ|180|03:00">MHD ➔ TBZ (مشهد - تبریز) | ۰۳:۰۰</option>
                            <option value="TBZ-MHD|160|02:40">TBZ ➔ MHD (تبریز - مشهد) | ۰۲:۴۰</option>
                            <option value="THR-OMH|100|01:40">THR ➔ OMH (تهران - ارومیه) | ۰۱:۴۰</option>
                            <option value="OMH-MHD|155|02:35">OMH ➔ MHD (ارومیه - مشهد) | ۰۲:۳۵</option>
                            <option value="MHD-OMH|185|03:05">MHD ➔ OMH (مشهد - ارومیه) | ۰۳:۰۵</option>
                            <option value="OMH-THR|95|01:35">OMH ➔ THR (ارومیه - تهران) | ۰۱:۳۵</option>
                            <option value="THR-ADU|80|01:20">THR ➔ ADU (تهران - اردبیل) | ۰۱:۲۰</option>
                            <option value="ADU-MHD|145|02:25">ADU ➔ MHD (اردبیل - مشهد) | ۰۲:۲۵</option>
                            <option value="MHD-ADU|160|02:40">MHD ➔ ADU (مشهد - اردبیل) | ۰۲:۴۰</option>
                            <option value="ADU-THR|75|01:15">ADU ➔ THR (اردبیل - تهران) | ۰۱:۱۵</option>
                            <option value="THR-BND|140|02:20">THR ➔ BND (تهران - بندرعباس) | ۰۲:۲۰</option>
                            <option value="BND-THR|155|02:35">BND ➔ THR (بندرعباس - تهران) | ۰۲:۳۵</option>
                            <!-- مسیرهای دو لگی (رفت و برگشت تجمیعی) -->
                            <option value="MHD-RAM-MHD|250|04:10">MHD ⇄ RAM (مشهد - رامسر - مشهد | رفت و برگشت) | ۰۴:۱۰</option>
                            <option value="MHD-BGW-MHD|375|06:15">MHD ⇄ BGW (مشهد - بغداد - مشهد | رفت و برگشت) | ۰۶:۱۵</option>
                        </select>
                    </div>

                    <button class="btn-add-leg" onclick="addLeg()">➕ اضافه کردن این لگ</button>

                    <!-- فهرست لگ‌های اضافه‌شده جاری -->
                    <div class="legs-list" id="currentLegsList"></div>

                    <!-- جمع ساعات لگ‌های جاری -->
                    <div class="total-box">
                        <span style="font-size:13px; color:var(--text-sub);">مجموع ساعات این پرواز:</span>
                        <span class="total-time-val" id="currentFlightTotal">00:00</span>
                    </div>

                    <button class="btn-primary" id="saveDutyBtn" onclick="saveFlightDuty()" disabled>
                        💾 ثبت و ذخیره پرواز در لاگ‌بوک
                    </button>
                </div>
            </div>

            <!-- Drawer Container -->
            <div id="drawerRoot">
                <div class="drawer-overlay" onclick="toggleDrawer(false)"></div>
                <div class="drawer-content">
                    <div class="drawer-header">
                        <h4 style="margin:0; font-size:15px;">بایگانی و سوابق پروازها</h4>
                        <span style="cursor:pointer; font-size:20px;" onclick="toggleDrawer(false)">✕</span>
                    </div>
                    <div class="drawer-body" id="archiveList"></div>
                </div>
            </div>

            <script>
                let currentLegs = [];

                function formatMinutes(minutes) {
                    const h = Math.floor(minutes / 60);
                    const m = minutes % 60;
                    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                }

                function addLeg() {
                    const sel = document.getElementById('routeSelect');
                    const parts = sel.value.split('|');
                    const routeName = parts[0];
                    const minutes = parseInt(parts[1], 10);
                    const fixedTime = parts[2];

                    currentLegs.push({
                        route: routeName,
                        minutes: minutes,
                        fixedTime: fixedTime
                    });

                    renderCurrentLegs();
                }

                function removeLeg(index) {
                    currentLegs.splice(index, 1);
                    renderCurrentLegs();
                }

                function renderCurrentLegs() {
                    const listContainer = document.getElementById('currentLegsList');
                    const totalDisplay = document.getElementById('currentFlightTotal');
                    const legsBadge = document.getElementById('legsCountBadge');
                    const saveBtn = document.getElementById('saveDutyBtn');

                    if (currentLegs.length === 0) {
                        listContainer.innerHTML = '';
                        totalDisplay.textContent = '00:00';
                        legsBadge.textContent = '۰ لگ انتخاب‌شده';
                        saveBtn.disabled = true;
                        return;
                    }

                    saveBtn.disabled = false;
                    legsBadge.textContent = `${currentLegs.length} لگ پروازی`;

                    let sumMin = 0;
                    listContainer.innerHTML = currentLegs.map((leg, idx) => {
                        sumMin += leg.minutes;
                        return `
                            <div class="leg-row">
                                <div>
                                    <span style="font-weight:bold;">لگ ${idx + 1}: ${leg.route}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span class="leg-badge">${leg.fixedTime}</span>
                                    <button class="btn-remove-leg" onclick="removeLeg(${idx})">✕</button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    totalDisplay.textContent = formatMinutes(sumMin);
                }

                function getDuties() {
                    return JSON.parse(localStorage.getItem('avafix_duties') || '[]');
                }

                function saveFlightDuty() {
                    if (currentLegs.length === 0) return;

                    const totalMinutes = currentLegs.reduce((sum, leg) => sum + leg.minutes, 0);
                    const now = new Date();
                    
                    // استخراج تاریخ و کلید ماه برای تجمیع ماهیانه
                    const faDate = now.toLocaleDateString('fa-IR');
                    const faMonthKey = faDate.split('/')[1] || '1'; // شناسایی ماه شمسی

                    const duty = {
                        id: Date.now(),
                        date: faDate,
                        monthKey: faMonthKey,
                        legs: [...currentLegs],
                        totalMinutes: totalMinutes,
                        totalTimeFormatted: formatMinutes(totalMinutes)
                    };

                    const duties = getDuties();
                    duties.unshift(duty);
                    localStorage.setItem('avafix_duties', JSON.stringify(duties));

                    // ریست فرم
                    currentLegs = [];
                    renderCurrentLegs();
                    updateMonthlyTotal();
                    toggleDrawer(true);
                }

                function deleteDuty(id) {
                    let duties = getDuties();
                    duties = duties.filter(d => d.id !== id);
                    localStorage.setItem('avafix_duties', JSON.stringify(duties));
                    renderArchive();
                    updateMonthlyTotal();
                }

                function updateMonthlyTotal() {
                    const duties = getDuties();
                    const nowFaMonth = new Date().toLocaleDateString('fa-IR').split('/')[1] || '1';

                    // تجمیع پروازهای ماه جاری
                    const currentMonthMinutes = duties
                        .filter(d => d.monthKey === nowFaMonth)
                        .reduce((acc, d) => acc + d.totalMinutes, 0);

                    document.getElementById('monthlyTotalDisplay').innerHTML = 
                        `${formatMinutes(currentMonthMinutes)} <span>ساعت</span>`;
                }

                function toggleDrawer(open) {
                    const root = document.getElementById('drawerRoot');
                    if(open) {
                        root.classList.add('drawer-open');
                        renderArchive();
                    } else {
                        root.classList.remove('drawer-open');
                    }
                }

                function renderArchive() {
                    const duties = getDuties();
                    const container = document.getElementById('archiveList');

                    if(duties.length === 0) {
                        container.innerHTML = '<div style="color:#718096; text-align:center; padding:20px 0;">هیچ پروازی ثبت نشده است</div>';
                        return;
                    }

                    container.innerHTML = duties.map(duty => `
                        <div class="archive-card">
                            <div class="archive-card-top">
                                <div>
                                    <span style="font-size:12px; color:#A0AEC0;">📅 ${duty.date}</span>
                                    <div style="font-size:14px; font-weight:bold; color:#68D391; margin-top:2px;">
                                        مجموع: ${duty.totalTimeFormatted}
                                    </div>
                                </div>
                                <button class="btn-del" onclick="deleteDuty(${duty.id})">حذف</button>
                            </div>
                            <div>
                                ${duty.legs.map((l, i) => `
                                    <div class="archive-leg-item">
                                        <span>لگ ${i+1}: ${l.route}</span>
                                        <span>${l.fixedTime}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('');
                }

                // مقداردهی اولیه در لود صفحه
                window.onload = function() {
                    updateMonthlyTotal();
                };
            </script>
        </body>
        </html>
        EOF

    - name: Build Signed APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AvaFix-v2.9-Release
        path: app/build/outputs/apk/release/*.apk
