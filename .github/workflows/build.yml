<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AvaFix Flight Logbook</title>

  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #131c31;
      --card-border: #223055;

      --primary: #38bdf8;
      --primary-hover: #0284c7;

      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      --input-bg: #0d1527;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        sans-serif;

      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background:
        linear-gradient(
          180deg,
          #131d36 0%,
          #0a0f1d 100%
        );

      padding: 18px 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      max-width: 620px;
      margin: auto;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 1.8rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .brand-subtitle {
      color: var(--primary);
      font-size: 0.75rem;
      margin-top: 2px;
    }

    main {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 15px;

      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      color: var(--primary);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* Dashboard */

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: #090e1a;
      border: 1px solid #1a2542;
      border-radius: 10px;
      padding: 13px;
      text-align: center;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 6px;
    }

    .stat-value {
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .stat-primary {
      color: var(--primary);
    }

    /* Form */

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      color: var(--text-muted);
      font-size: 0.83rem;
    }

    input {
      width: 100%;

      background: var(--input-bg);
      color: white;

      border: 1px solid #2d3f6d;
      border-radius: 8px;

      padding: 11px 12px;

      font-family: inherit;
      font-size: 0.95rem;

      outline: none;
    }

    input:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 2px rgba(56, 189, 248, 0.08);
    }

    .route-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: end;
    }

    .route-arrow {
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--primary);
      font-size: 1.3rem;
    }

    /* Buttons */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 11px 14px;

      border-radius: 8px;
      border: none;

      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;

      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #001018;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: white;
    }

    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;

      border: 1px solid #334155;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;

      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-small {
      padding: 6px 9px;
      font-size: 0.75rem;
    }

    /* Preview */

    .flight-preview {
      display: none;

      margin-top: 10px;

      background: #090e1a;
      border: 1px solid #1a2542;
      border-radius: 9px;

      padding: 12px;

      text-align: center;
    }

    .flight-route {
      color: white;
      font-size: 1.2rem;
      font-weight: 800;

      direction: ltr;
    }

    .flight-duration {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;

      margin-top: 4px;
    }

    /* Filter */

    .filter-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;

      margin-bottom: 12px;
    }

    /* Total */

    .total-box {
      background:
        linear-gradient(
          135deg,
          #0d2035,
          #090e1a
        );

      border: 1px solid #244568;
      border-radius: 12px;

      padding: 15px;

      text-align: center;
      margin-bottom: 12px;
    }

    .total-label {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .total-value {
      color: var(--primary);
      font-size: 1.7rem;
      font-weight: 900;

      margin-top: 4px;
    }

    /* History */

    .flight-record {
      background: #0d1527;

      border: 1px solid #1f2d50;
      border-radius: 10px;

      padding: 12px;
      margin-bottom: 8px;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;
    }

    .record-date {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .record-duration {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 800;
    }

    .record-route {
      color: white;

      font-size: 1rem;
      font-weight: 800;

      margin-top: 7px;

      direction: ltr;
      text-align: center;
    }

    .record-actions {
      display: flex;
      justify-content: flex-end;

      gap: 5px;
      margin-top: 9px;
    }

    .empty {
      color: var(--text-muted);
      text-align: center;

      font-size: 0.85rem;
      padding: 22px 10px;
    }

    /* Modal */

    .modal-overlay {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.72);

      z-index: 1000;

      align-items: center;
      justify-content: center;

      padding: 15px;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;

      background: var(--card-bg);

      border: 1px solid var(--card-border);
      border-radius: 14px;

      padding: 18px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      color: var(--primary);

      font-size: 1rem;
      font-weight: 700;

      margin-bottom: 14px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-buttons .btn {
      flex: 1;
    }

    @media (max-width: 430px) {
      .route-row {
        grid-template-columns: 1fr;
      }

      .route-arrow {
        height: 20px;
        transform: rotate(90deg);
      }

      .filter-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">

    <div class="brand-icon">✈️</div>

    <div>
      <div class="brand-title">
        AvaFix Logbook
      </div>

      <div class="brand-subtitle">
        Flight Logbook
      </div>
    </div>

  </div>
</header>


<main>

  <!-- DASHBOARD -->

  <section class="card">

    <div class="card-title">
      📊 خلاصه پرواز
    </div>

    <div class="dashboard">

      <div class="stat">
        <div class="stat-label">
          تعداد کل پرواز
        </div>

        <div
          id="totalFlights"
          class="stat-value stat-primary">
          ۰
        </div>
      </div>


      <div class="stat">
        <div class="stat-label">
          مجموع کل پرواز
        </div>

        <div
          id="totalFlightTime"
          class="stat-value">
          ۰۰:۰۰
        </div>
      </div>


      <div class="stat">
        <div class="stat-label">
          پروازهای امسال
        </div>

        <div
          id="yearFlights"
          class="stat-value stat-primary">
          ۰
        </div>
      </div>


      <div class="stat">
        <div class="stat-label">
          ساعت امسال
        </div>

        <div
          id="yearFlightTime"
          class="stat-value">
          ۰۰:۰۰
        </div>
      </div>

    </div>
  </section>


  <!-- ADD FLIGHT -->

  <section class="card">

    <div class="card-title">
      📝 ثبت پرواز جدید
    </div>


    <div class="form-group">

      <label for="flightDate">
        تاریخ پرواز
      </label>

      <input
        id="flightDate"
        type="text"
        inputmode="numeric"
        placeholder="۱۴۰۵/۰۷/۰۷">

    </div>


    <div class="route-row">

      <div class="form-group">

        <label for="origin">
          🛫 مبدأ
        </label>

        <input
          id="origin"
          type="text"
          maxlength="4"
          placeholder="MHD"
          autocomplete="off">

      </div>


      <div class="route-arrow">
        ➜
      </div>


      <div class="form-group">

        <label for="destination">
          🛬 مقصد
        </label>

        <input
          id="destination"
          type="text"
          maxlength="4"
          placeholder="BGW"
          autocomplete="off">

      </div>

    </div>


    <div class="form-group">

      <label for="duration">
        ⏱️ مدت پرواز
      </label>

      <input
        id="duration"
        type="text"
        inputmode="numeric"
        placeholder="مثال: 01:35">

    </div>


    <div
      id="flightPreview"
      class="flight-preview">

      <div
        id="previewRoute"
        class="flight-route">
      </div>

      <div
        id="previewDuration"
        class="flight-duration">
      </div>

    </div>


    <button
      id="btnSaveFlight"
      class="btn btn-primary"
      style="width:100%; margin-top:8px;">

      ✈️ ثبت پرواز

    </button>

  </section>


  <!-- HISTORY -->

  <section class="card">

    <div class="card-title">
      📚 آرشیو پروازها
    </div>


    <div class="filter-row">

      <input
        id="filterMonth"
        type="text"
        inputmode="numeric"
        placeholder="فیلتر ماه: ۱۴۰۵/۰۷">

      <button
        id="btnClearFilter"
        class="btn btn-secondary">

        نمایش همه

      </button>

    </div>


    <div class="total-box">

      <div class="total-label">
        مجموع پروازهای نمایش‌داده‌شده
      </div>

      <div
        id="filteredTotal"
        class="total-value">
        ۰۰:۰۰
      </div>

    </div>


    <div id="historyList"></div>

  </section>

</main>


<!-- EDIT MODAL -->

<div
  id="editModal"
  class="modal-overlay">

  <div class="modal-box">

    <div class="modal-title">
      ✏️ ویرایش پرواز
    </div>


    <input
      type="hidden"
      id="editId">


    <div class="form-group">

      <label for="editDate">
        تاریخ
      </label>

      <input
        id="editDate"
        type="text"
        inputmode="numeric">

    </div>


    <div class="route-row">

      <div class="form-group">

        <label for="editOrigin">
          مبدأ
        </label>

        <input
          id="editOrigin"
          type="text"
          maxlength="4">

      </div>


      <div class="route-arrow">
        ➜
      </div>


      <div class="form-group">

        <label for="editDestination">
          مقصد
        </label>

        <input
          id="editDestination"
          type="text"
          maxlength="4">

      </div>

    </div>


    <div class="form-group">

      <label for="editDuration">
        مدت پرواز
      </label>

      <input
        id="editDuration"
        type="text"
        inputmode="numeric">

    </div>


    <div class="modal-buttons">

      <button
        id="btnCancelEdit"
        class="btn btn-secondary">

        انصراف

      </button>


      <button
        id="btnUpdateFlight"
        class="btn btn-primary">

        ذخیره تغییرات

      </button>

    </div>

  </div>

</div>


<script>

  /*
   * ==========================================
   * STORAGE
   * ==========================================
   */

  const STORAGE_KEY =
    "avafix_flight_logbook_v3";


  let flights = [];


  /*
   * ==========================================
   * DIGITS
   * ==========================================
   */

  function toEnglishDigits(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/[۰-۹]/g, function(digit) {
        return "۰۱۲۳۴۵۶۷۸۹".indexOf(digit);
      })
      .replace(/[٠-٩]/g, function(digit) {
        return "٠١٢٣٤٥٦٧٨٩".indexOf(digit);
      });
  }


  function toPersianDigits(value) {

    return String(value)
      .replace(/\d/g, function(digit) {
        return "۰۱۲۳۴۵۶۷۸۹"[digit];
      });
  }


  /*
   * ==========================================
   * DATE
   * ==========================================
   */

  function getTodayPersian() {

    return new Intl.DateTimeFormat(
      "fa-IR-u-ca-persian",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).format(new Date());

  }


  function normalizePersianDate(value) {

    return toEnglishDigits(value)
      .replace(/-/g, "/")
      .replace(/\s/g, "")
      .trim();

  }


  function isValidPersianDate(value) {

    const date =
      normalizePersianDate(value);

    const match =
      /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(date);

    if (!match) {
      return false;
    }

    const year =
      Number(match[1]);

    const month =
      Number(match[2]);

    const day =
      Number(match[3]);

    if (year < 1300 || year > 1500) {
      return false;
    }

    if (month < 1 || month > 12) {
      return false;
    }

    if (day < 1 || day > 31) {
      return false;
    }

    if (month >= 7 && month <= 11 && day > 30) {
      return false;
    }

    if (month === 12 && day > 30) {
      return false;
    }

    return true;

  }


  /*
   * ==========================================
   * TIME
   * ==========================================
   */

  function parseDuration(value) {

    if (!value) {
      return 0;
    }

    let text =
      toEnglishDigits(value)
        .trim()
        .replace(/[٫.]/g, ":");


    if (text.includes(":")) {

      const parts =
        text.split(":");

      if (parts.length !== 2) {
        return 0;
      }

      const hours =
        parseInt(parts[0], 10);

      const minutes =
        parseInt(parts[1], 10);

      if (
        Number.isNaN(hours) ||
        Number.isNaN(minutes) ||
        hours < 0 ||
        minutes < 0 ||
        minutes > 59
      ) {
        return 0;
      }

      return hours * 60 + minutes;
    }


    const minutes =
      parseInt(text, 10);

    if (
      Number.isNaN(minutes) ||
      minutes <= 0
    ) {
      return 0;
    }

    return minutes;

  }


  function formatDuration(minutes) {

    const total =
      Math.max(
        0,
        Number(minutes) || 0
      );

    const hours =
      Math.floor(total / 60);

    const mins =
      total % 60;

    return (
      String(hours).padStart(2, "0") +
      ":" +
      String(mins).padStart(2, "0")
    );

  }


  function formatDurationPersian(minutes) {

    return toPersianDigits(
      formatDuration(minutes)
    );

  }


  /*
   * ==========================================
   * ID
   * ==========================================
   */

  function createId() {

    return (
      Date.now().toString(36) +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 9)
    );

  }


  /*
   * ==========================================
   * STORAGE
   * ==========================================
   */

  function saveFlights() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(flights)
    );

  }


  function loadFlights() {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      flights = [];
      return;
    }

    try {

      const parsed =
        JSON.parse(saved);

      flights =
        Array.isArray(parsed)
          ? parsed
          : [];

    } catch (error) {

      console.error(
        "خطا در خواندن اطلاعات:",
        error
      );

      flights = [];

    }

  }


  /*
   * ==========================================
   * CURRENT YEAR
   * ==========================================
   */

  function getCurrentPersianYear() {

    const today =
      normalizePersianDate(
        getTodayPersian()
      );

    return today.split("/")[0];

  }


  /*
   * ==========================================
   * ADD FLIGHT
   * ==========================================
   */

  function saveNewFlight() {

    const dateInput =
      document
        .getElementById("flightDate")
        .value;

    const origin =
      document
        .getElementById("origin")
        .value
        .trim()
        .toUpperCase();

    const destination =
      document
        .getElementById("destination")
        .value
        .trim()
        .toUpperCase();

    const durationInput =
      document
        .getElementById("duration")
        .value;

    const date =
      normalizePersianDate(
        dateInput
      );

    const minutes =
      parseDuration(
        durationInput
      );


    if (!isValidPersianDate(date)) {

      alert(
        "تاریخ معتبر نیست.\nمثال: ۱۴۰۵/۰۷/۰۷"
      );

      return;
    }


    if (!origin || !destination) {

      alert(
        "لطفاً مبدأ و مقصد را وارد کنید."
      );

      return;
    }


    if (
      origin.length < 3 ||
      destination.length < 3
    ) {

      alert(
        "کد مبدأ و مقصد باید حداقل ۳ حرف باشد."
      );

      return;
    }


    if (minutes <= 0) {

      alert(
        "مدت پرواز معتبر نیست.\nمثال: 01:35"
      );

      return;
    }


    const flight = {

      id: createId(),

      datePersian: date,

      origin: origin,

      destination: destination,

      minutes: minutes

    };


    flights.unshift(flight);

    saveFlights();


    document
      .getElementById("origin")
      .value = "";

    document
      .getElementById("destination")
      .value = "";

    document
      .getElementById("duration")
      .value = "";


    updatePreview();

    renderAll();

  }


  /*
   * ==========================================
   * PREVIEW
   * ==========================================
   */

  function updatePreview() {

    const origin =
      document
        .getElementById("origin")
        .value
        .trim()
        .toUpperCase();

    const destination =
      document
        .getElementById("destination")
        .value
        .trim()
        .toUpperCase();

    const duration =
      parseDuration(
        document
          .getElementById("duration")
          .value
      );

    const preview =
      document
        .getElementById("flightPreview");


    if (
      origin &&
      destination &&
      duration > 0
    ) {

      preview.style.display =
        "block";

      document
        .getElementById("previewRoute")
        .textContent =
        origin + " → " + destination;

      document
        .getElementById("previewDuration")
        .textContent =
        "⏱ " +
        formatDurationPersian(
          duration
        );

    } else {

      preview.style.display =
        "none";

    }

  }


  /*
   * ==========================================
   * FILTER
   * ==========================================
   */

  function getFilteredFlights() {

    const filter =
      normalizePersianDate(
        document
          .getElementById("filterMonth")
          .value
      );


    if (!filter) {
      return flights.slice();
    }


    const month =
      filter.substring(0, 7);


    return flights.filter(
      function(flight) {

        const date =
          normalizePersianDate(
            flight.datePersian || ""
          );

        return date.substring(0, 7) === month;

      }
    );

  }


  /*
   * ==========================================
   * TOTAL
   * ==========================================
   */

  function calculateTotal(list) {

    return list.reduce(
      function(sum, flight) {

        return (
          sum +
          Number(
            flight.minutes || 0
          )
        );

      },
      0
    );

  }


  /*
   * ==========================================
   * DASHBOARD
   * ==========================================
   */

  function renderDashboard() {

    const total =
      calculateTotal(flights);


    const currentYear =
      getCurrentPersianYear();


    const yearFlights =
      flights.filter(
        function(flight) {

          const date =
            normalizePersianDate(
              flight.datePersian || ""
            );

          return date.startsWith(
            currentYear + "/"
          );

        }
      );


    const yearTotal =
      calculateTotal(
        yearFlights
      );


    document
      .getElementById("totalFlights")
      .textContent =
      toPersianDigits(
        flights.length
      );


    document
      .getElementById("totalFlightTime")
      .textContent =
      formatDurationPersian(
        total
      );


    document
      .getElementById("yearFlights")
      .textContent =
      toPersianDigits(
        yearFlights.length
      );


    document
      .getElementById("yearFlightTime")
      .textContent =
      formatDurationPersian(
        yearTotal
      );

  }


  /*
   * ==========================================
   * HISTORY
   * ==========================================
   */

  function renderHistory() {

    const list =
      getFilteredFlights();


    const container =
      document
        .getElementById("historyList");


    container.innerHTML = "";


    const total =
      calculateTotal(list);


    document
      .getElementById("filteredTotal")
      .textContent =
      formatDurationPersian(
        total
      );


    if (list.length === 0) {

      container.innerHTML =
        '<div class="empty">' +
        '✈️ هنوز پروازی ثبت نشده است.' +
        '</div>';

      return;
    }


    list.forEach(
      function(flight) {

        const record =
          document.createElement(
            "div"
          );


        record.className =
          "flight-record";


        const top =
          document.createElement(
            "div"
          );

        top.className =
          "record-top";


        const date =
          document.createElement(
            "div"
          );

        date.className =
          "record-date";

        date.textContent =
          "📅 " +
          toPersianDigits(
            flight.datePersian ||
            "بدون تاریخ"
          );


        const duration =
          document.createElement(
            "div"
          );

        duration.className =
          "record-duration";

        duration.textContent =
          formatDurationPersian(
            flight.minutes
          );


        top.appendChild(date);
        top.appendChild(duration);


        const route =
          document.createElement(
            "div"
          );

        route.className =
          "record-route";

        route.textContent =
          flight.origin +
          " → " +
          flight.destination;


        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "record-actions";


        const editButton =
          document.createElement(
            "button"
          );

        editButton.className =
          "btn btn-secondary btn-small";

        editButton.textContent =
          "✏️ ویرایش";

        editButton.addEventListener(
          "click",
          function() {
            editFlight(flight.id);
          }
        );


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.className =
          "btn btn-danger btn-small";

        deleteButton.textContent =
          "🗑 حذف";

        deleteButton.addEventListener(
          "click",
          function() {
            deleteFlight(flight.id);
          }
        );


        actions.appendChild(
          editButton
        );

        actions.appendChild(
          deleteButton
        );


        record.appendChild(top);
        record.appendChild(route);
        record.appendChild(actions);

        container.appendChild(record);

      }
    );

  }


  /*
   * ==========================================
   * EDIT
   * ==========================================
   */

  function editFlight(id) {

    const flight =
      flights.find(
        function(item) {
          return item.id === id;
        }
      );


    if (!flight) {
      return;
    }


    document
      .getElementById("editId")
      .value =
      flight.id;


    document
      .getElementById("editDate")
      .value =
      toPersianDigits(
        flight.datePersian
      );


    document
      .getElementById("editOrigin")
      .value =
      flight.origin;


    document
      .getElementById("editDestination")
      .value =
      flight.destination;


    document
      .getElementById("editDuration")
      .value =
      formatDuration(
        flight.minutes
      );


    document
      .getElementById("editModal")
      .style.display =
      "flex";

  }


  /*
   * ==========================================
   * UPDATE
   * ==========================================
   */

  function updateFlight() {

    const id =
      document
        .getElementById("editId")
        .value;


    const flight =
      flights.find(
        function(item) {
          return item.id === id;
        }
      );


    if (!flight) {
      return;
    }


    const date =
      normalizePersianDate(
        document
          .getElementById("editDate")
          .value
      );


    const origin =
      document
        .getElementById("editOrigin")
        .value
        .trim()
        .toUpperCase();


    const destination =
      document
        .getElementById("editDestination")
        .value
        .trim()
        .toUpperCase();


    const minutes =
      parseDuration(
        document
          .getElementById("editDuration")
          .value
      );


    if (!isValidPersianDate(date)) {

      alert(
        "تاریخ واردشده معتبر نیست."
      );

      return;
    }


    if (
      origin.length < 3 ||
      destination.length < 3
    ) {

      alert(
        "کد مبدأ و مقصد باید حداقل ۳ حرف باشد."
      );

      return;
    }


    if (minutes <= 0) {

      alert(
        "مدت پرواز معتبر نیست."
      );

      return;
    }


    flight.datePersian =
      date;

    flight.origin =
      origin;

    flight.destination =
      destination;

    flight.minutes =
      minutes;


    saveFlights();

    closeEditModal();

    renderAll();

  }


  /*
   * ==========================================
   * DELETE
   * ==========================================
   */

  function deleteFlight(id) {

    const flight =
      flights.find(
        function(item) {
          return item.id === id;
        }
      );


    if (!flight) {
      return;
    }


    const confirmed =
      confirm(
        "پرواز " +
        flight.origin +
        " → " +
        flight.destination +
        " حذف شود؟"
      );


    if (!confirmed) {
      return;
    }


    flights =
      flights.filter(
        function(item) {
          return item.id !== id;
        }
      );


    saveFlights();

    renderAll();

  }


  /*
   * ==========================================
   * MODAL
   * ==========================================
   */

  function closeEditModal() {

    document
      .getElementById("editModal")
      .style.display =
      "none";

  }


  /*
   * ==========================================
   * RENDER ALL
   * ==========================================
   */

  function renderAll() {

    renderDashboard();

    renderHistory();

  }


  /*
   * ==========================================
   * INIT
   * ==========================================
   */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadFlights();


      const dateInput =
        document
          .getElementById("flightDate");


      dateInput.value =
        getTodayPersian();


      document
        .getElementById("btnSaveFlight")
        .addEventListener(
          "click",
          saveNewFlight
        );


      [
        "origin",
        "destination",
        "duration"
      ].forEach(
        function(id) {

          document
            .getElementById(id)
            .addEventListener(
              "input",
              updatePreview
            );

        }
      );


      document
        .getElementById("filterMonth")
        .addEventListener(
          "input",
          renderHistory
        );


      document
        .getElementById("btnClearFilter")
        .addEventListener(
          "click",
          function() {

            document
              .getElementById("filterMonth")
              .value = "";

            renderHistory();

          }
        );


      document
        .getElementById("btnUpdateFlight")
        .addEventListener(
          "click",
          updateFlight
        );


      document
        .getElementById("btnCancelEdit")
        .addEventListener(
          "click",
          closeEditModal
        );


      document
        .getElementById("editModal")
        .addEventListener(
          "click",
          function(event) {

            if (
              event.target.id ===
              "editModal"
            ) {

              closeEditModal();

            }

          }
        );


      renderAll();

    }
  );

</script>

</body>
</html>
