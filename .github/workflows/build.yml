name: Build AvaFix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: pip install Pillow

    - name: Build Android Project & Assets
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/java/com/avafix/logbook
        mkdir -p app/src/main/res/values

        # 1. ساخت آیکون با پایتون
        cat << 'EOF' > make_icon.py
        import math
        from PIL import Image, ImageDraw

        def generate_ava_icon(size):
            img = Image.new("RGBA", (size, size), (9, 11, 16, 255))
            draw = ImageDraw.Draw(img)
            r = size * 0.44
            cx, cy = size * 0.5, size * 0.5
            draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill=(211, 26, 43, 255))
            steps = 360
            heart_scale = size * 0.016
            heart_cx = cx
            heart_cy = cy - size * 0.02
            for i in range(steps):
                t = (2 * math.pi * i) / steps
                x = 16 * (math.sin(t) ** 3)
                y = -(13 * math.cos(t) - 5 * math.cos(2*t) - 2 * math.cos(3*t) - math.cos(4*t))
                px = heart_cx + x * heart_scale
                py = heart_cy + y * heart_scale
                rad = (size * 0.012) + (math.sin(t*3) * (size * 0.005))
                draw.ellipse([px - rad, py - rad, px + rad, py + rad], fill=(255, 255, 255, 245))
            return img

        sizes = {
            "app/src/main/res/mipmap-hdpi/ic_launcher.png": 72,
            "app/src/main/res/mipmap-xhdpi/ic_launcher.png": 96,
            "app/src/main/res/mipmap-xxhdpi/ic_launcher.png": 144,
            "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": 192
        }
        for path, s in sizes.items():
            icon = generate_ava_icon(s)
            icon.save(path, "PNG")
        EOF
        python make_icon.py

        # 2. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        # 3. build.gradle اصلی
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 4. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.avafix.logbook'
            compileSdk 34

            defaultConfig {
                applicationId "com.avafix.logbook"
                minSdk 24
                targetSdk 34
                versionCode 15
                versionName "3.0"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                }
            }
        }
        EOF

        # 5. Strings & Manifest
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">AvaFix</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/avafix/logbook/MainActivity.java
        package com.avafix.logbook;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        # 7. UI و لاجیک اپلیکیشن
        cat << 'EOF' > app/src/main/assets/index.html
        <!DOCTYPE html>
        <html lang="fa" dir="rtl">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>AvaFix Crew Logbook</title>
            <style>
                :root {
                    --bg-dark: #090B10;
                    --card-bg: #12151D;
                    --primary-red: #D31A2B;
                    --accent-cyan: #00E5FF;
                    --text-main: #FFFFFF;
                    --text-sub: #A0AEC0;
                    --border-clr: #232936;
                }
                * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
                body {
                    margin: 0;
                    padding: 0;
                    background: var(--bg-dark);
                    color: var(--text-main);
                    font-family: system-ui, -apple-system, sans-serif;
                    direction: rtl;
                }
                .header {
                    background: var(--card-bg);
                    padding: 14px 18px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    border-bottom: 1px solid var(--border-clr);
                    position: sticky;
                    top: 0;
                    z-index: 100;
                }
                .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
                .brand-badge { background: var(--primary-red); color: white; padding: 2px 7px; border-radius: 6px; font-size: 11px; }
                .drawer-btn {
                    background: #1A202C;
                    border: 1px solid var(--border-clr);
                    color: white;
                    padding: 8px 12px;
                    border-radius: 8px;
                    cursor: pointer;
                    font-size: 12px;
                }
                .container { padding: 14px; max-width: 520px; margin: 0 auto; }
                
                .month-banner {
                    background: linear-gradient(135deg, #1C1917 0%, #12151D 100%);
                    border: 1px solid #38292B;
                    border-radius: 12px;
                    padding: 14px 16px;
                    margin-bottom: 14px;
                }
                .month-banner-row {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                .month-title { font-size: 13px; color: var(--text-sub); }
                .month-hours { font-size: 24px; font-weight: 900; color: #68D391; }
                .month-hours span { font-size: 13px; color: var(--primary-red); font-weight: normal; margin-right: 4px; }

                .card {
                    background: var(--card-bg);
                    border: 1px solid var(--border-clr);
                    border-radius: 12px;
                    padding: 16px;
                    margin-bottom: 14px;
                }
                .section-header {
                    font-size: 14px;
