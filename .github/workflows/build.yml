name: Build AvaFix APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Source Code and Build APK
      run: |
        mkdir -p app/src/main/java/com/avacrew/avafix
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">AvaFix</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.avacrew.avafix">
            <application
                android:label="@string/app_name"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/avacrew/avafix/MainActivity.java
        package com.avacrew.avafix;

        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.LinearLayout;
        import android.widget.TextView;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(60, 100, 60, 60);

                TextView title = new TextView(this);
                title.setText("✈️ AvaFix - Crew Logbook");
                title.setTextSize(22);
                layout.addView(title);

                TextView info = new TextView(this);
                info.setText("\nFixed Times:\n• MHD-RAS-MHD: 250 mins\n• MHD-BGW-MHD: 375 mins\n\nStatus: Ready to Fly");
                info.setTextSize(16);
                layout.addView(info);

                setContentView(layout);
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.avacrew.avafix'
            compileSdk 34

            defaultConfig {
                applicationId "com.avacrew.avafix"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

        # دانلود مستقیم Wrapper استاندارد
        curl -s -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip
        unzip -q gradle.zip
        ./gradle-8.4/bin/gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

        # آماده‌سازی نام خروجی
        cp app/build/outputs/apk/debug/app-debug.apk AvaFix.apk

    - name: Publish Release APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete v1.0 --yes || true
        git tag -d v1.0 || true
        git push origin :refs/tags/v1.0 || true
        gh release create v1.0 AvaFix.apk --title "AvaFix v1.0" --notes "AvaFix APK build for Crew Logbook"
