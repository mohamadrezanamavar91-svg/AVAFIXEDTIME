name: Build AvaFix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create App & Build APK
      run: |
        cordova create avafix com.avacrew.avafix AvaFix
        cd avafix
        cat << 'EOF' > www/index.html
        <!DOCTYPE html>
        <html lang="fa" dir="rtl">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>AvaFix</title>
          <style>
            body { font-family: sans-serif; background: #0b132b; color: #fff; padding: 20px; text-align: center; }
            .card { background: #1c2541; padding: 20px; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
            h2 { color: #48cae4; }
            .badge { background: #3a506b; padding: 8px 12px; border-radius: 6px; display: inline-block; margin: 5px; }
          </style>
        </head>
        <body>
          <div class="card">
            <h2>سامانه AvaFix</h2>
            <p>ثبت و محاسبه اتوماتیک ساعات پرواز بر اساس Fix Time</p>
            <hr style="border-color: #3a506b;">
            <div class="badge">MHD-RAS-MHD: ۲۵۰ دقیقه</div>
            <div class="badge">MHD-BGW-MHD: ۳۷۵ دقیقه</div>
          </div>
        </body>
        </html>
        EOF
        cordova platform add android
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AvaFix-APK
        path: avafix/platforms/android/app/build/outputs/apk/debug/app-debug.apk
