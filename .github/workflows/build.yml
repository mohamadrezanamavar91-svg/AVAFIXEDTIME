name: Build AvaFix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Complete Project
      run: |
        mkdir -p app/src/main/java/com/avacrew/avafix
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">AvaFix</string>
        </resources>
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.avacrew.avafix'
            compileSdk 34

            defaultConfig {
                applicationId "com.avacrew.avafix"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/avacrew/avafix/MainActivity.java
        package com.avacrew.avafix;

        import android.os.Bundle;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(50, 80, 50, 50);

                TextView title = new TextView(this);
                title.setText("AvaFix - Crew Logbook");
                title.setTextSize(22);
                layout.addView(title);

                TextView info = new TextView(this);
                info.setText("\nFixed Times:\n• MHD-RAS-MHD (R/T): 250 mins\n• MHD-BGW-MHD (R/T): 375 mins\n\nApp successfully installed!");
                info.setTextSize(16);
                layout.addView(info);

                setContentView(layout);
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AvaFix-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
