name: Build AvaFix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project with Drawer & Monthly Engine
      run: |
        mkdir -p app/src/main/java/com/avafix/logbook
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        # root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # app build.gradle
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.avafix.logbook'
            compileSdk 34
            defaultConfig {
                applicationId "com.avafix.logbook"
                minSdk 24
                targetSdk 34
                versionCode 6
                versionName "2.4"
            }
            buildTypes {
                release { minifyEnabled false }
            }
        }
        EOF

        # Styles
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AvaFix" parent="android:Theme.Material.NoActionBar">
                <item name="android:statusBarColor">#0C0E12</item>
            </style>
        </resources>
        EOF

        # Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="AvaFix"
                android:theme="@style/Theme.AvaFix">
                <activity
                    android:name=".MainActivity"
                    android:windowSoftInputMode="adjustResize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Layout
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <android.webkit.WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview"
            android:layout_width="match_parent"
            android:layout_height="match_parent" />
        EOF

        # MainActivity
        cat << 'EOF' > app/src/main/java/com/avafix/logbook/MainActivity.java
        package com.avafix.logbook;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                WebView webView = findViewById(R.id.webview);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);

                String html = "<!DOCTYPE html><html lang='fa' dir='rtl'><head><meta charset='utf-8'>" +
                    "<meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>" +
                    "<style>" +
                    "  :root { --red: #D31A2B; --bg: #0C0E12; --card: #15181F; --border: #232834; --text: #FFFFFF; --sub: #8B93A7; --ok: #34D399; --gold: #F59E0B; }" +
                    "  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }" +
                    "  body { background: var(--bg); color: var(--text); padding: 16px 14px 60px; min-height: 100vh; overflow-x: hidden; }" +
                    "  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }" +
                    "  .menu-btn { background: #1B1F2A; border: 1px solid var(--border); color: #fff; width: 42px; height: 42px; border-radius: 10px; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }" +
                    "  .title-group { text-align: center; flex: 1; }" +
                    "  .badge { display: inline-flex; align-items: center; background: rgba(211,26,43,0.15); border: 1px solid rgba(211,26,43,0.35); padding: 3px 10px; border-radius: 99px; color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: 1px; }" +
                    "  h1 { font-size: 20px; font-weight: 900; margin-top: 3px; }" +
                    "  .curr-month-pill { font-size: 11px; color: var(--gold); font-weight: 700; margin-top: 2px; }" +
                    "  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s ease; }" +
                    "  .drawer-overlay.active { opacity: 1; pointer-events: auto; }" +
                    "  .drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #12151D; border-left: 1px solid var(--border); z-index: 101; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 24px 18px; display: flex; flex-direction: column; }" +
                    "  .drawer.active { right: 0; }" +
                    "  .drawer-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 20px; }" +
                    "  .drawer-head h2 { font-size: 16px; font-weight: 800; }" +
                    "  .close-btn { background: none; border: none; color: var(--sub); font-size: 20px; cursor: pointer; }" +
                    "  .cal-toggle { display: grid; grid-template-columns: 1fr 1fr; background: #0A0C10; padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; }" +
                    "  .cal-btn { background: none; border: none; color: var(--sub); padding: 8px 0; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; }" +
                    "  .cal-btn.active { background: var(--red); color: #fff; }" +
                    "  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }" +
                    "  .card::before { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; background: var(--red); }" +
                    "  label { display: block; font-size: 11px; color: var(--sub); margin: 10px 0 5px; font-weight: 700; }" +
                    "  select, input { width: 100%; background: #0A0C10; border: 1px solid #2B313F; border-radius: 10px; color: #fff; padding: 11px 12px; font-size: 14px; font-weight: 700; outline: none; transition: border-color 0.2s; }" +
                    "  select:focus, input:focus { border-color: var(--red); }" +
                    "  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }" +
                    "  .btn-add { width: 100%; margin-top: 14px; background: #1B212D; border: 1px solid #333C50; color: #fff; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }" +
                    "  .btn-add:active { background: #222938; }" +
                    "  .btn-sum { width: 100%; margin-top: 14px; background: var(--red); border: none; color: #fff; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(211,26,43,0.35); }" +
                    "  .btn-sum:active { transform: scale(0.98); }" +
                    "  .route-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }" +
                    "  .route-info b { font-size: 15px; color: #fff; display: block; }" +
                    "  .route-info span { font-size: 11px; color: var(--sub); }" +
                    "  .route-action { display: flex; align-items: center; gap: 10px; }" +
                    "  .route-badge { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); color: var(--gold); padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: 800; }" +
                    "  .btn-del { background: rgba(211,26,43,0.15); border: 1px solid rgba(211,26,43,0.3); color: var(--red); font-size: 14px; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }" +
                    "  .total-card { background: linear-gradient(135deg, #15181F 0%, #1c1518 100%); border: 1px solid rgba(211,26,43,0.4); border-radius: 16px; padding: 18px; text-align: center; margin-top: 14px; }" +
                    "  .tot-title { font-size: 12px; color: var(--sub); font-weight: 700; }" +
                    "  .tot-val { font-size: 36px; font-weight: 900; color: var(--ok); font-variant-numeric: tabular-nums; margin: 4px 0; }" +
                    "  .tot-sub { font-size: 12px; color: var(--sub); }" +
                    "</style></head><body>" +
                    "  <div class='drawer-overlay' id='drawerOverlay' onclick='toggleDrawer(false)'></div>" +
                    "  <div class='drawer' id='drawerMenu'>" +
                    "    <div class='drawer-head'><h2>تنظیم ماه و تقویم</h2><button class='close-btn' onclick='toggleDrawer(false)'>✕</button></div>" +
                    "    <label>نوع تقویم</label>" +
                    "    <div class='cal-toggle'>" +
                    "      <button class='cal-btn active' id='shamsiBtn' onclick='setCalendarType(\"shamsi\")'>شمسی</button>" +
                    "      <button class='cal-btn' id='miladiBtn' onclick='setCalendarType(\"miladi\")'>میلادی</button>" +
                    "    </div>" +
                    "    <label>انتخاب ماه کاری</label>" +
                    "    <select id='monthSelect' onchange='changeActiveMonth()'></select>" +
                    "    <div style='margin-top:auto; font-size:11px; color:var(--sub); text-align:center;'>پروازهای هر ماه به طور کاملاً مستقل در حافظه ثبت و محاسبه می‌شوند.</div>" +
                    "  </div>" +
                    "  <div class='top-bar'>" +
                    "    <button class='menu-btn' onclick='toggleDrawer(true)'>☰</button>" +
                    "    <div class='title-group'>" +
                    "      <div class='badge'>✈ AVA AIRLINES LOGBOOK</div>" +
                    "      <h1>AvaFix Flights</h1>" +
                    "      <div class='curr-month-pill' id='activeMonthBadge'>ماه: فروردین</div>" +
                    "    </div>" +
                    "    <div style='width:42px;'></div>" +
                    "  </div>" +
                    "  <div class='card'>" +
                    "    <label>انتخاب روت پروازی از لیست</label>" +
                    "    <select id='routeSelect' onchange='onRouteSelected()'></select>" +
                    "    <div class='grid-2'>" +
                    "      <div><label>کد روت</label><input type='text' id='routeCodeInput' placeholder='مثال: THR-MHD'></div>" +
                    "      <div><label>فیکس تایم (HH:MM)</label><input type='text' id='fixTimeInput' placeholder='01:45' style='direction:ltr; text-align:center; font-weight:900; color:var(--gold);'></div>" +
                    "    </div>" +
                    "    <button class='btn-add' onclick='addFlightRoute()'>+ افزودن این روت به لیست</button>" +
                    "  </div>" +
                    "  <div class='card'>" +
                    "    <div style='display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-weight:800; font-size:14px;'>" +
                    "      <span>لیست روت‌های ثبت‌شده این ماه</span>" +
                    "      <span style='font-size:11px; color:var(--red); cursor:pointer;' onclick='clearMonthFlights()'>پاکسازی ماه</span>" +
                    "    </div>" +
                    "    <div id='routesListContainer'></div>" +
                    "    <button class='btn-sum' onclick='calculateTotalHours()'>🧮 محاسبه و بستن جمع ساعات</button>" +
                    "  </div>" +
                    "  <div class='total-card' id='summaryBox' style='display:none;'>" +
                    "    <div class='tot-title'>مجموع ساعات پرواز بسته شده (Total Fix Time)</div>" +
                    "    <div class='tot-val' id='totalDisplay'>00:00</div>" +
                    "    <div class='tot-sub' id='totalCountDisplay'>۰ سورت پروازی • ۰ دقیقه</div>" +
                    "  </div>" +
                    "  <script>" +
                    "    const AVA_ROUTES_DB = [" +
                    "      { code: 'THR-MHD', name: 'تهران ⇄ مشهد', dur: '01:45', min: 105 }," +
                    "      { code: 'MHD-THR', name: 'مشهد ⇄ تهران', dur: '01:55', min: 115 }," +
                    "      { code: 'THR-GSM', name: 'تهران ⇄ قشم', dur: '02:25', min: 145 }," +
                    "      { code: 'GSM-THR', name: 'قشم ⇄ تهران', dur: '02:35', min: 155 }," +
                    "      { code: 'MHD-KSH', name: 'مشهد ⇄ کرمانشاه', dur: '02:45', min: 165 }," +
                    "      { code: 'KSH-MHD', name: 'کرمانشاه ⇄ مشهد', dur: '02:25', min: 145 }," +
                    "      { code: 'MHD-SYZ', name: 'مشهد ⇄ شیراز', dur: '02:35', min: 155 }," +
                    "      { code: 'SYZ-MHD', name: 'شیراز ⇄ مشهد', dur: '02:20', min: 140 }," +
                    "      { code: 'MHD-AWZ', name: 'مشهد ⇄ اهواز', dur: '03:05', min: 185 }," +
                    "      { code: 'AWZ-MHD', name: 'اهواز ⇄ مشهد', dur: '02:40', min: 160 }," +
                    "      { code: 'THR-KIH', name: 'تهران ⇄ کیش', dur: '02:25', min: 145 }," +
                    "      { code: 'KIH-THR', name: 'کیش ⇄ تهران', dur: '02:25', min: 145 }," +
                    "      { code: 'MHD-IFN', name: 'مشهد ⇄ اصفهان', dur: '02:20', min: 140 }," +
                    "      { code: 'IFN-MHD', name: 'اصفهان ⇄ مشهد', dur: '02:05', min: 125 }," +
                    "      { code: 'MHD-TBZ', name: 'مشهد ⇄ تبریز', dur: '03:00', min: 180 }," +
                    "      { code: 'TBZ-MHD', name: 'تبریز ⇄ مشهد', dur: '02:40', min: 160 }," +
                    "      { code: 'THR-OMH', name: 'تهران ⇄ ارومیه', dur: '01:40', min: 100 }," +
                    "      { code: 'OMH-MHD', name: 'ارومیه ⇄ مشهد', dur: '02:35', min: 155 }," +
                    "      { code: 'MHD-OMH', name: 'مشهد ⇄ ارومیه', dur: '03:05', min: 185 }," +
                    "      { code: 'OMH-THR', name: 'ارومیه ⇄ تهران', dur: '01:35', min: 95 }," +
                    "      { code: 'THR-ADU', name: 'تهران ⇄ اردبیل', dur: '01:20', min: 80 }," +
                    "      { code: 'ADU-MHD', name: 'اردبیل ⇄ مشهد', dur: '02:25', min: 14', name: 'مشهد ⇄ تبریز', dur: '03:00', min: 180 }," +
                    "      { code: 'TBZ-MHD', name: 'تبریز ⇄ مشهد', dur: '02:40', min: 160 }," +
                    "      { code: 'THR-OMH', name: 'تهران ⇄ ارومیه', dur: '01:40', min: 100 }," +
                    "      { code: 'OMH-MHD', name: 'ارومیه ⇄ مشهد', dur: '02:35', min: 155 }," +
                    "      { code: 'MHD-OMH', name: 'مشهد ⇄ ارومیه', dur: '03:05', min: 185 }," +
                    "      { code: 'OMH-THR', name: 'ارومیه ⇄ تهران', dur: '01:35', min: 95 }," +
                    "      { code: 'THR-ADU', name: 'تهران ⇄ اردبیل', dur: '01:20', min: 80 }," +
                    "      { code: 'ADU-MHD', name: 'اردبیل ⇄ مشهد', dur: '02:25', min: 145 }," +
                    "      { code: 'MHD-ADU', name: 'مشهد ⇄ اردبیل', dur: '02:40', min: 160 }," +
                    "      { code: 'ADU-THR', name: 'اردبیل ⇄ تهران', dur: '01:15', min: 75 }," +
                    "      { code: 'THR-BND', name: 'تهران ⇄ بندرعباس', dur: '02:20', min: 140 }," +
                    "      { code: 'BND-THR', name: 'بندرعباس ⇄ تهران', dur: '02: 95 }," +
                    "      { code: 'THR-SYZ', name: 'تهران ⇄ شیراز', dur: '01:40', min: 100 }," +
                    "      { code: 'SYZ-THR', name: 'شیراز ⇄ تهران', dur: '01:40', min: 100 }," +
                    "      { code: 'MHD-NJF', name: 'مشهد ⇄ نجف', dur: '03:20', min: 200 }," +
                    "      { code: 'NJF-MHD', name: 'نجف ⇄ مشهد', dur: '03:10', min: 190 }," +
                    "      { code: 'IKA-IST', name: 'امام خمینی ⇄ استانبول', dur: '04:50', min: 290 }," +
                    "      { code: 'IST-IKA', name: 'استانبول ⇄ امام خمینی', dur: '04:10', min: 250 }," +
                    "      { code: 'HAM-NJF', name: 'همدان ⇄ نجف', dur: '01:50', min: 110 }," +
                    "      { code: 'NJF-HAM', name: 'نجف ⇄ همدان', dur: '01:40', min: 100 }," +
                    "      { code: 'IKA-NJF', name: 'امام خمینی ⇄ نجف', dur: '02:20', min: 140 }," +
                    "      { code: 'NJF-IKA', name: 'نجف ⇄ امام خمینی', dur: '02:00', min: 120 }," +
                    "      { code: 'THR-TBZ', name: 'تهران ⇄ تبریز', dur: '01:25', min: 85 }," +
                    "      { code: 'TBZ-THR', name: 'تبریز ⇄ تهران', dur: '01:20', min: 80 }," +
                    "      { code: 'THR-ZAH', name: 'تهران ⇄ زاهدان', dur: '02:30', min: 150 }," +
                    "      { code: 'ZAH-THR', name: 'زاهدان ⇄ تهران', dur: '02:30', min: 150 }," +
                    "      { code: 'THR-ZBR', name: 'تهران ⇄ چابهار', dur: '02:45', min: 165 }," +
                    "      { code: 'ZBR-THR', name: 'چابهار ⇄ تهران', dur: '02:55', min: 175 }," +
                    "      { code: 'THR-BUZ', name: 'تهران ⇄ بوشهر', dur: '01:40', min: 100 }," +
                    "      { code: 'BUZ-THR', name: 'بوشهر ⇄ تهران', dur: '01:45', min: 105 }," +
                    "      { code: 'KSH-KIH', name: 'کرمانشاه ⇄ کیش', dur: '02:10', min: 130 }," +
                    "      { code: 'KIH-KSH', name: 'کیش ⇄ کرمانشاه', dur: '02:20', min: 140 }," +
                    "      { code: 'KIS-TBZ', name: 'کیش ⇄ تبریز', dur: '03:00', min: 180 }," +
                    "      { code: 'TBZ-KIS', name: 'تبریز ⇄ کیش', dur: '02:45', min: 165 }," +
                    "      { code: 'KIH-IFN', name: 'کیش ⇄ اصفهان', dur: '01:30', min: 90 }," +
                    "      { code: 'IFN-KIH', name: 'اصفهان ⇄ کیش', dur: '01:35', min: 95 }," +
                    "      { code: 'MHD-RAS-MHD', name: 'مشهد ⇄ رامسر ⇄ مشهد', dur: '04:10', min: 250 }," +
                    "      { code: 'MHD-BGW-MHD', name: 'مشهد ⇄ بغداد ⇄ مشهد', dur: '06:15', min: 375 }" +
                    "    ];" +
                    "    const SHAMSI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];" +
                    "    const MILADI_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];" +
                    "    let calType = localStorage.getItem('ava_cal_type') || 'shamsi';" +
                    "    let activeMonthKey = localStorage.getItem('ava_active_month') || 'shamsi_0';" +
                    "    function toggleDrawer(open) {" +
                    "      document.getElementById('drawerOverlay').classList.toggle('active', open);" +
                    "      document.getElementById('drawerMenu').classList.toggle('active', open);" +
                    "    }" +
                    "    function setCalendarType(type) {" +
                    "      calType = type;" +
                    "      localStorage.setItem('ava_cal_type', type);" +
                    "      document.getElementById('shamsiBtn').classList.toggle('active', type === 'shamsi');" +
                    "      document.getElementById('miladiBtn').classList.toggle('active', type === 'miladi');" +
                    "      populateMonthSelector();" +
                    "    }" +
                    "    function populateMonthSelector() {" +
                    "      const sel = document.getElementById('monthSelect');" +
                    "      sel.innerHTML = '';" +
                    "      const list = calType === 'shamsi' ? SHAMSI_MONTHS : MILADI_MONTHS;" +
                    "      list.forEach((m, idx) => {" +
                    "        const opt = document.createElement('option');" +
                    "        opt.value = `${calType}_${idx}`;" +
                    "        opt.textContent = m;" +
                    "        sel.appendChild(opt);" +
                    "      });" +
                    "      if (sel.querySelector(`option[value='${activeMonthKey}']`)) {" +
                    "        sel.value = activeMonthKey;" +
                    "      } else {" +
                    "        activeMonthKey = sel.value;" +
                    "        localStorage.setItem('ava_active_month', activeMonthKey);" +
                    "      }" +
                    "      updateMonthHeader();" +
                    "      renderMonthRoutes();" +
                    "    }" +
                    "    function changeActiveMonth() {" +
                    "      activeMonthKey = document.getElementById('monthSelect').value;" +
                    "      localStorage.setItem('ava_active_month', activeMonthKey);" +
                    "      updateMonthHeader();" +
                    "      renderMonthRoutes();" +
                    "      toggleDrawer(false);" +
                    "    }" +
                    "    function updateMonthHeader() {" +
                    "      const [type, idx] = activeMonthKey.split('_');" +
                    "      const name = (type === 'shamsi' ? SHAMSI_MONTHS : MILADI_MONTHS)[Number(idx)];" +
                    "      document.getElementById('activeMonthBadge').innerText = `ماه انتخابی: ${name} (${type === 'shamsi' ? 'شمسی' : 'میلادی'})`;" +
                    "    }" +
                    "    function initRouteOptions() {" +
                    "      const sel = document.getElementById('routeSelect');" +
                    "      sel.innerHTML = '<option value=\"-1\">-- انتخاب روت مصوب --</option>';" +
                    "      AVA_ROUTES_DB.forEach((r, idx) => {" +
                    "        const opt = document.createElement('option');" +
                    "        opt.value = idx;" +
                    "        opt.textContent = `${r.code} • ${r.name} (${r.dur})`;" +
                    "        sel.appendChild(opt);" +
                    "      });" +
                    "    }" +
                    "    function onRouteSelected() {" +
                    "      const sel = document.getElementById('routeSelect');" +
                    "      if (sel.value < 0) return;" +
                    "      const item = AVA_ROUTES_DB[sel.value];" +
                    "      document.getElementById('routeCodeInput').value = item.code;" +
                    "      document.getElementById('fixTimeInput').value = item.dur;" +
                    "    }" +
                    "    function getMonthFlights() {" +
                    "      return JSON.parse(localStorage.getItem(`ava_flights_${activeMonthKey}`) || '[]');" +
                    "    }" +
                    "    function saveMonthFlights(list) {" +
                    "      localStorage.setItem(`ava_flights_${activeMonthKey}`, JSON.stringify(list));" +
                    "    }" +
                    "    function addFlightRoute() {" +
                    "      const code = document.getElementById('routeCodeInput').value.trim();" +
                    "      const dur = document.getElementById('fixTimeInput').value.trim();" +
                    "      if (!code || !dur) {" +
                    "        alert('لطفاً کد روت و فیکس تایم را وارد کنید.');" +
                    "        return;" +
                    "      }" +
                    "      const parts = dur.split(':');" +
                    "      if (parts.length !== 2) {" +
                    "        alert('فرمت فیکس تایم باید HH:MM باشد');" +
                    "        return;" +
                    "      }" +
                    "      const min = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);" +
                    "      if (isNaN(min)) {" +
                    "        alert('زمان نامعتبر است.');" +
                    "        return;" +
                    "      }" +
                    "      const list = getMonthFlights();" +
                    "      list.push({ id: Date.now(), code: code, dur: dur, min: min });" +
                    "      saveMonthFlights(list);" +
                    "      renderMonthRoutes();" +
                    "      document.getElementById('summaryBox').style.display = 'none';" +
                    "    }" +
                    "    function removeFlightRoute(id) {" +
                    "      let list = getMonthFlights();" +
                    "      list = list.filter(item => item.id !== id);" +
                    "      saveMonthFlights(list);" +
                    "      renderMonthRoutes();" +
                    "      document.getElementById('summaryBox').style.display = 'none';" +
                    "    }" +
                    "    function clearMonthFlights() {" +
                    "      if (confirm('آیا از پاکسازی تمام روت‌های این ماه اطمینان دارید؟')) {" +
                    "        localStorage.removeItem(`ava_flights_${activeMonthKey}`);" +
                    "        renderMonthRoutes();" +
                    "        document.getElementById('summaryBox').style.display = 'none';" +
                    "      }" +
                    "    }" +
                    "    function renderMonthRoutes() {" +
                    "      const list = getMonthFlights();" +
                    "      const c = document.getElementById('routesListContainer');" +
                    "      c.innerHTML = '';" +
                    "      if (list.length === 0) {" +
                    "        c.innerHTML = '<div style=\"text-align:center; padding:16px 0; color:var(--sub); font-size:12px;\">هنوز روتی برای این ماه ثبت نشده است.</div>';" +
                    "        return;" +
                    "      }" +
                    "      list.forEach((item, idx) => {" +
                    "        const div = document.createElement('div');" +
                    "        div.className = 'route-item';" +
                    "        div.innerHTML = `<div class='route-info'><b>${idx + 1}. ${item.code}</b><span>فیکس مصوب: ${item.dur} (${item.min} دقیقه)</span></div>` +" +
                    "          `<div class='route-action'><div class='route-badge'>${item.dur}</div>` +" +
                    "          `<button class='btn-del' onclick='removeFlightRoute(${item.id})'>✕</button></div>`;" +
                    "        c.appendChild(div);" +
                    "      });" +
                    "    }" +
                    "    function calculateTotalHours() {" +
                    "      const list = getMonthFlights();" +
                    "      if (list.length === 0) {" +
                    "        alert('هیچ روتی برای محاسبه جمع ساعات وجود ندارد.');" +
                    "        return;" +
                    "      }" +
                    "      let totalMin = 0;" +
                    "      list.forEach(item => totalMin += item.min);" +
                    "      const h = Math.floor(totalMin / 60);" +
                    "      const m = totalMin % 60;" +
                    "      const formatted = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');" +
                    "      document.getElementById('totalDisplay').innerText = formatted;" +
                    "      document.getElementById('totalCountDisplay').innerText = `${list.length} لگ پروازی • ${totalMin} دقیقه مجموع پرواز`;" +
                    "      document.getElementById('summaryBox').style.display = 'block';" +
                    "      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });" +
                    "    }" +
