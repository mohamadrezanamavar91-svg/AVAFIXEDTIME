name: Build AvaFix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Android Project and Build APK
      run: |
        # ساختار پوشه‌ها
        mkdir -p app/src/main/java/com/avacrew/avafix
        mkdir -p app/src/main/res/values

        # مقادیر متن
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">AvaFix</string>
        </resources>
        EOF

        # مانیفست اندروید
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.avacrew.avafix">
            <application
                android:label="@string/app_name"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # کد اصلی اپلیکیشن
        cat << 'EOF' > app/src/main/java/com/avacrew/avafix/MainActivity.java
        package com.avacrew.avafix;

        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.LinearLayout;
        import android.widget.TextView;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(60, 100, 60, 60);

                TextView title = new TextView(this);
                title.setText("✈️ AvaFix - Crew Logbook");
                title.setTextSize(22);
                layout.addView(title);

                TextView info = new TextView(this);
                info.setText("\nFixed Times:\n• MHD-RAS-MHD: 250 mins\n• MHD-BGW-MHD: 375 mins\n\nStatus: Ready to Fly");
                info.setTextSize(16);
                layout.addView(info);

                setContentView(layout);
            }
        }
        EOF

        # تنظیمات پروژه
        cat << 'EOF' > settings.gradle
        rootProject.name = "AvaFix"
        include ':app'
        EOF

        # build.gradle ریشه
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # build.gradle اپلیکیشن
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.avacrew.avafix'
            compileSdk 34

            defaultConfig {
                applicationId "com.avacrew.avafix"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

        # دانلود و آماده‌سازی Gradle بدون خطا
        curl -s -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip
        unzip -q gradle.zip
        ./gradle-8.4/bin/gradle wrapper
        chmod +x gradlew

        # ساخت فایل نصبی APK
        ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AvaFix-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
